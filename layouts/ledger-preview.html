<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Ledger Preview</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			background: #eef1f4;
			/* The report itself is a fixed width - without this, a narrow screen would show
			   a horizontal scrollbar for the sliver of the iframe that doesn't fit, even
			   though the iframe itself is scaled to fit (see fitFrame() below). */
			overflow-x: hidden;
		}

		/* Reports its own scaled (visual) size, since a CSS transform doesn't change the
		   iframe's own layout box - without this, the wrapper would still occupy the
		   report's full, unscaled width/height even when the iframe is shrunk to fit. */
		#frameWrapper {
			overflow: hidden;
			/* No horizontal margin - the scale calculation below sizes this to fit the full
			   available width, so any horizontal margin here would just push part of the
			   content past the edge of the screen. */
			margin: 1rem 0;
		}

		/* Fixed at a size comfortably larger than any real report page (21cm ~ 794px wide).
		   This must never shrink below the report's own natural size - doing so would change
		   the iframe's *internal* viewport and fire the report's own internal resize
		   handling (it has its own independent responsive scaling for when it's opened
		   directly, not via this wrapper), which would shrink its content before this page
		   ever gets a chance to measure the true, natural size. Only a CSS transform (never
		   the width/height) is used below to fit it to the screen from the outside. */
		#ledgerFrame {
			border: none;
			display: block;
			width: 900px;
			height: 1400px;
		}
	</style>
</head>

<body>
	<div id="frameWrapper">
		<iframe id="ledgerFrame" src="ledger.html?message=1"></iframe>
	</div>

	<script>
		// Fits the iframe to the available screen width, like how a PDF viewer auto-fits a
		// document to a phone screen - a pure visual scale (CSS transform) applied to the
		// iframe element itself. The report inside the iframe renders at its normal, natural
		// size and is never touched - only how large the iframe is drawn from the outside
		// changes, so the actual data/pagination is completely unaffected.
		function fitFrame() {
			const iframe = document.getElementById('ledgerFrame');
			const wrapper = document.getElementById('frameWrapper');
			const doc = iframe.contentDocument || iframe.contentWindow.document;
			if (!doc || !doc.documentElement) {
				return;
			}

			// Reset the transform only (never the iframe's own width/height - see the CSS
			// comment above) before measuring, so repeated calls always measure the report's
			// true natural size rather than compounding an already-applied scale.
			iframe.style.transform = 'none';

			// Deliberately the *content's* total extent (scrollWidth), not just the .page
			// element's own width - .page is centered inside the iframe (margin: 0 auto)
			// with empty space on either side, and since the transform below scales the
			// whole iframe, that offset scales too. Using only .page's own width here would
			// under-count how far the content actually reaches, clipping its right edge.
			const naturalWidth = doc.documentElement.scrollWidth;
			const naturalHeight = doc.documentElement.scrollHeight;
			if (naturalWidth === 0 || naturalHeight === 0) {
				return;
			}

			// A small safety margin (rather than the exact measured width) absorbs the
			// vertical scrollbar this page needs for a tall multi-page report.
			const availableWidth = document.documentElement.clientWidth - 20;
			const scale = Math.min(1, availableWidth / naturalWidth);

			iframe.style.transform = `scale(${scale})`;
			iframe.style.transformOrigin = 'top left';
			wrapper.style.width = `${naturalWidth * scale}px`;
			wrapper.style.height = `${naturalHeight * scale}px`;
		}

		const ledgerFrame = document.getElementById('ledgerFrame');
		ledgerFrame.addEventListener('load', () => {
			// A short delay so the report (which generates its own content on load) has
			// finished rendering before the first fit measures it.
			setTimeout(fitFrame, 50);
		});

		let resizeTimer;
		window.addEventListener('resize', () => {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(fitFrame, 200);
		});
	</script>
</body>

</html>
