<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Ledger Preview</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			background: #eef1f4;
			/* The report itself is a fixed width - without this, a narrow screen would show
			   a horizontal scrollbar for the sliver of the iframe that doesn't fit, even
			   though the iframe itself is scaled to fit (see fitFrame() below). */
			overflow-x: hidden;
		}

		/* Reports its own scaled (visual) size, since a CSS transform doesn't change the
		   iframe's own layout box - without this, the wrapper would still occupy the
		   report's full, unscaled width/height even when the iframe is shrunk to fit. */
		#frameWrapper {
			overflow: hidden;
			/* No horizontal margin - the scale calculation below sizes this to fit the full
			   available width, so any horizontal margin here would just push part of the
			   content past the edge of the screen. */
			margin: 1rem 0;
		}

		/* Fixed at a size comfortably larger than any real report page (21cm ~ 794px wide).
		   This must never shrink below the report's own natural size - doing so would change
		   the iframe's *internal* viewport and fire the report's own internal resize
		   handling (it has its own independent responsive scaling for when it's opened
		   directly, not via this wrapper), which would shrink its content before this page
		   ever gets a chance to measure the true, natural size. Only a CSS transform (never
		   the width/height) is used below to fit it to the screen from the outside. */
		#ledgerFrame {
			border: none;
			display: block;
			width: 900px;
			height: 1400px;
		}

		/* onBeforePrint (below) expands the iframe to its true natural size so the entire
		   multi-page report becomes part of the wrapper page's actual layout instead of just
		   whatever fit in the fixed on-screen box - but #frameWrapper's own width/height
		   (JS-set to match the small *scaled* on-screen size) and overflow:hidden would
		   otherwise clip that expanded iframe right back down. !important guarantees this
		   wins over those inline styles regardless of whatever the last on-screen fit
		   happened to compute. */
		@media print {
			#frameWrapper {
				width: auto !important;
				height: auto !important;
				overflow: visible !important;
				margin: 0 !important;
			}
		}
	</style>
</head>

<body>
	<div id="frameWrapper">
		<iframe id="ledgerFrame" src="ledger.html?message=1"></iframe>
	</div>

	<script>
		// Fits the iframe to the available screen width, like how a PDF viewer auto-fits a
		// document to a phone screen - a pure visual scale (CSS transform) applied to the
		// iframe element itself. The report inside the iframe renders at its normal, natural
		// size and is never touched - only how large the iframe is drawn from the outside
		// changes, so the actual data/pagination is completely unaffected.
		// Browser zoom (Ctrl +/-) scales the *entire* tab uniformly, including everything
		// inside the iframe - so the outer viewport width and the report's measured natural
		// width both move by the same factor when the user zooms, and that factor cancels out
		// of the fit-to-width ratio in fitFrame() below. Without this baseline, zooming
		// in/out alone (with no actual window resize) wouldn't change the on-screen size at
		// all. Captured once at load as this display's "no zoom applied yet" reference point,
		// since devicePixelRatio also reflects real monitor DPI, not just zoom - only
		// *changes* from this baseline matter.
		const baselinePixelRatio = window.devicePixelRatio;

		function fitFrame() {
			const iframe = document.getElementById('ledgerFrame');
			const wrapper = document.getElementById('frameWrapper');
			const doc = iframe.contentDocument || iframe.contentWindow.document;
			if (!doc || !doc.documentElement) {
				return;
			}

			// Reset the transform only (never the iframe's own width/height - see the CSS
			// comment above) before measuring, so repeated calls always measure the report's
			// true natural size rather than compounding an already-applied scale.
			iframe.style.transform = 'none';

			// Deliberately the *content's* total extent (scrollWidth), not just the .page
			// element's own width - .page is centered inside the iframe (margin: 0 auto)
			// with empty space on either side, and since the transform below scales the
			// whole iframe, that offset scales too. Using only .page's own width here would
			// under-count how far the content actually reaches, clipping its right edge.
			const naturalWidth = doc.documentElement.scrollWidth;
			const naturalHeight = doc.documentElement.scrollHeight;
			if (naturalWidth === 0 || naturalHeight === 0) {
				return;
			}

			// A small safety margin (rather than the exact measured width) absorbs the
			// vertical scrollbar this page needs for a tall multi-page report.
			const availableWidth = document.documentElement.clientWidth - 20;
			// Always fill the available width - like a mobile PDF viewer's "fit to width",
			// this scales UP on a screen wider than the report's natural size (previously
			// capped at 1, which left the report at its natural size with dead space around
			// it on anything wider than ~21cm) as well as down on a narrower one.
			const fitScale = availableWidth / naturalWidth;
			// See baselinePixelRatio's comment: this factor is what actually makes zooming
			// in/out change the on-screen size, since fitScale alone is zoom-invariant.
			const zoomFactor = window.devicePixelRatio / baselinePixelRatio;
			const scale = fitScale * zoomFactor;

			iframe.style.transform = `scale(${scale})`;
			iframe.style.transformOrigin = 'top left';
			wrapper.style.width = `${naturalWidth * scale}px`;
			wrapper.style.height = `${naturalHeight * scale}px`;
		}

		const ledgerFrame = document.getElementById('ledgerFrame');
		ledgerFrame.addEventListener('load', () => {
			// A short delay so the report (which generates its own content on load) has
			// finished rendering before the first fit measures it.
			setTimeout(fitFrame, 50);
		});

		// The iframe is deliberately kept at a fixed 900x1400px box on screen and only
		// visually scaled up/down with a CSS transform to fit the screen - but printing the
		// *outer* wrapper page captures only what's actually laid out in that fixed box.
		// Confirmed via a real print: the output only ever contained the first report page's
		// content (oddly split across 2 physical pages) followed by several completely blank
		// pages - the rest of the multi-page report, which on screen you'd only ever reach by
		// scrolling inside the iframe, was never printed at all. Expanding the iframe to its
		// true natural size beforehand (no transform, no clipping) makes the *entire* report
		// part of the wrapper page's actual layout, so printing the wrapper prints all of it.
		window.addEventListener('beforeprint', () => {
			const iframe = document.getElementById('ledgerFrame');
			const doc = iframe.contentDocument || iframe.contentWindow.document;
			if (!doc || !doc.documentElement) {
				return;
			}
			const naturalWidth = doc.documentElement.scrollWidth;
			const naturalHeight = doc.documentElement.scrollHeight;
			iframe.style.transform = 'none';
			iframe.style.width = `${naturalWidth}px`;
			iframe.style.height = `${naturalHeight}px`;
		});

		window.addEventListener('afterprint', () => {
			const iframe = document.getElementById('ledgerFrame');
			iframe.style.width = '';
			iframe.style.height = '';
			fitFrame();
		});

		let resizeTimer;
		function scheduleFit() {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(fitFrame, 200);
		}
		window.addEventListener('resize', scheduleFit);
		// visualViewport is purpose-built to report zoom-driven viewport changes and fires
		// more reliably for zoom-only changes (no accompanying window resize) than window's
		// own resize event across browsers - belt-and-suspenders alongside the listener above.
		window.visualViewport?.addEventListener('resize', scheduleFit);
	</script>
</body>

</html>
