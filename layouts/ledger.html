	<style>
		body {
			background: white;
			/* The page is a fixed 21cm wide - on a narrow screen (phone, small window) that
			   would normally force a horizontal scrollbar. The responsive scaling below
			   shrinks the *visual* size to fit instead, so nothing should ever actually
			   overflow, but this is a safety net against any residual sub-pixel overflow. */
			overflow-x: hidden;
		}

		.page {
			background: white;
			width: 21cm;
			height: 29.7cm;
			box-shadow: 0 0 0.1cm rgba(0, 0, 0, 0.1);
			display: block;
		}

		/* Each page sits inside a frame that reports the *scaled* (visual) size, since a
		   CSS transform doesn't change the element's own layout box - without this wrapper,
		   the page would still occupy its full 21cm of layout width/height even when scaled
		   down to look smaller, causing a horizontal scrollbar and a large gap below it. */
		.page-frame {
			overflow: hidden;
			margin: 0 auto 0.5cm auto;
		}

		.page-frame .page {
			margin: 0;
		}

		@media print {
			/* Printing must always use the true, full-size layout regardless of whatever
			   on-screen responsive scale is currently applied - !important guarantees this
			   beats the inline transform/width/height the JS sets for on-screen display. */
			.page-frame {
				width: auto !important;
				height: auto !important;
				overflow: visible !important;
				margin: 0 !important;
			}

			.page {
				transform: none !important;
			}
		}

		@page {

			margin: 0;
		}

		@media print {

			body,

			/* Our JS decides which .page a row belongs to by measuring heights up front, but
			   without this, the browser's print engine can still slice an individual row's
			   multi-line cell content across a physical page boundary if the real printed
			   height (after margins/DPI) comes out even slightly smaller than what the JS
			   budgeted for - the tail of a row's account-name/narration line spills onto the

			tr {

	<script>
		// Flags to control the visibility of certain sections of the invoice.
		let isHSNSection = false; //for Hsn header hide
		let isTermandConditionSection = false; //for hide product column and hsn header hide
		var typeOfCopy = 0;
		let currentPageCount = 1; // Initialize the page count for each copy
		let jsonData;
		let pageSize;
		let isFirstPage = true; // Flag to indicate the first page
		let maxHeight;

		// Function to convert a base64 encoded string to UTF-8.
		function base64ToUtf8(base64) {

			const binaryString = atob(base64);
			const bytes = new Uint8Array([...binaryString].map(char => char.charCodeAt(0)));
			return new TextDecoder().decode(bytes);
		}

		// Measures the header's rendered height. This used to poll across animation frames
		// waiting for a non-zero height, on the assumption that layout might not be ready
		// the instant an element is appended - but getBoundingClientRect() forces the
		// browser to flush any pending layout synchronously before returning, so the value
		// is always accurate immediately, no waiting needed. That async polling was the
		// actual cause of a real bug: generateSingleCopy() (below) had to be async to use
		// it, and the browser does not wait for an async 'beforeprint' handler to finish
		// before capturing print output - so printing could snapshot the page after this
		// function's synchronous reset (which deletes the old pages) but before the
		// rebuild finished, printing a blank page. Making this synchronous lets the whole
		// generation run start-to-finish in one go, safe to call from 'beforeprint'.
		function measureHeaderHeight(currentPage) {
			const headerAddSection = currentPage.querySelector('.FloatNum');
			// getBoundingClientRect() returns sub-pixel float values that reflect true CSS
			// layout geometry - unlike offsetHeight, which rounds to whole device pixels and
			// can round differently at different browser zoom levels, which was throwing off
			// pagination whenever the page was zoomed in or out.
			return headerAddSection ? headerAddSection.getBoundingClientRect().height : 0;
		}

		// Renders a throwaway footer off in the body (not the visible page) purely to measure
		// its real height, since it's the same content/font on every page regardless of page
		// number - measuring once and reusing that height is enough, no need to re-measure per page.
		function measureFooterHeight(jsonData, pageNumber) {
			const probe = document.createElement('div');
			generateFooterSection(probe, jsonData, pageNumber);
			document.body.appendChild(probe);
			// generateFooterSection's own element is absolutely positioned, so it doesn't
			// contribute to a non-positioned wrapper's height - measure it directly instead.
			const height = probe.firstElementChild.getBoundingClientRect().height;
			document.body.removeChild(probe);
			return height;
		}

		// Main function to generate the invoice content.
		function generateSingleCopy() {
			// Defensive reset: some preview/PDF flows reuse the same window or iframe for a
			// second render instead of doing a full page reload (e.g. navigating back to the
			// outer screen, changing its zoom, then reopening the preview without a refresh).
			// If generateSingleCopy() runs again in a document that already has pages from a
			// previous run, clear them first - otherwise the old pages stay in the DOM and the
			// new run's pages get appended after them, showing duplicated content (and both
			// runs label their first page "Page No: 1", since currentPageCount below never
			// resets on its own). Clearing the whole wrapper (rather than just removing .page
			// elements) also takes the .page-frame wrappers with them - otherwise every
			// regenerate would leave an empty, orphaned frame behind.
			getPagesWrapper().innerHTML = '';
			currentPageCount = 1;
			isFirstPage = true;

			let searchParams = new URLSearchParams(window.location.search);
			let message = searchParams.get('message');

			if (message) {
				try {
					var retrievedValue = localStorage.getItem('ledgerData');
					if (retrievedValue !== null) {
						let decodedString = base64ToUtf8(retrievedValue);
						jsonData = JSON.parse(decodedString);

					}
					else {
						let decodedString = base64ToUtf8(message);
						jsonData = JSON.parse(decodedString);
					}



					//Create new page
					let currentPage = createNewPage();

					let localPageNumber = currentPageCount;

					// Generate sections of the invoice (header, attribute)
					addSectionToPage(currentPage, generateHeaderSection, jsonData, isFirstPage);

					const headerAddHeight = measureHeaderHeight(currentPage);

					// Calculate available height for body section
					// Footer height was previously a hardcoded 80px guess, which reserved far
					// more room than the footer (a single line of date/time + page number)
					// actually needs - leaving a large unused gap before the footer instead of
					// letting data fill the page. Measure its real rendered height instead, so
					// the reserved space matches what the footer actually needs, with only a
					// small buffer for breathing room.
					const footerSectionHeight = measureFooterHeight(jsonData, localPageNumber) + 40;
					const usedHeight = headerAddHeight + footerSectionHeight;
					// Page height was previously a hardcoded 1100px constant, but every other
					// measurement here (header/footer/row heights) is a live getBoundingClientRect()
					// reading, which reports the actual visually-rendered size at whatever zoom is
					// currently active. At 100% zoom those happen to line up, so this went
					// unnoticed - but at any other zoom, the real rendered page height shrinks or
					// grows while this constant stayed fixed, over- or under-allocating the row
					// budget by the difference and causing rows to overflow into (or leave a huge
					// gap before) the footer. Measuring the actual page keeps every quantity in the
					// same, currently-true unit.
					const pageHeightInPx = currentPage.getBoundingClientRect().height;
					maxHeight = pageHeightInPx - usedHeight;

					// Generate body and footer sections with pagination
					generateBodySectionWithPagination(currentPage, jsonData, jsonData.ledger_details, maxHeight);
					addSectionToPage(currentPage, generateFooterSection, jsonData, localPageNumber);

				} catch (error) {
					console.error('Error decoding or parsing JSON:', error);
				}
			} else {
				console.error('No message found in the URL parameters.');
			}
		}

		// Wraps every .page in a single container so responsive scaling (see
		// applyResponsiveScale below) has one place to look for all pages.
		function getPagesWrapper() {
			let wrapper = document.getElementById('pagesWrapper');
			if (!wrapper) {
				wrapper = document.createElement('div');
				wrapper.id = 'pagesWrapper';
				document.body.appendChild(wrapper);
			}
			return wrapper;
		}

		// Function to create a new page for the invoice.
		function createNewPage() {
			const pageFrame = document.createElement('div');
			pageFrame.className = 'page-frame';

			let newPage = document.createElement('div');
			newPage.className = 'page';
			newPage.style.position = 'relative';
			newPage.style.pageBreakBefore = 'always';
			newPage.style.width = "21cm"
			newPage.style.height = "1100px"; /* a4 size */

			pageFrame.appendChild(newPage);
			getPagesWrapper().appendChild(pageFrame);
			return newPage;
		}

		// Function to add a section to the current page.
		function addSectionToPage(currentPage, sectionFunc, ...args) {
			let tempSection = document.createElement('div');
			sectionFunc(tempSection, ...args);
			currentPage.appendChild(tempSection);
			return tempSection.getBoundingClientRect().height;
		}

		function generateBodySectionWithPagination(currentPage, jsonData, items, maxHeight) {
			let tbody;
			let currentHeight = 0;
			let headerHeight = 0;
			let adjustedMaxHeight = 0;
			const middleGap = 5; // Gap between sections
			let currentPageCount = 1;
			let td;

			// Setup a body section for the current page
			function setupBodySection() {


				const bodySection = document.createElement('div');
				bodySection.className = 'body';
				if (jsonData.config.main_table_border == false) {
					bodySection.style.border = 'hidden';
				}
				else {
					bodySection.style.border = '1px solid black';
				}
				bodySection.style.margin = '0 20px';
				// No max-height here on purpose: the JS row-counting logic below is what
				// actually decides how many rows fit on this page (by comparing measured
				// heights against adjustedMaxHeight). A CSS max-height would cap this box's
				// border at our *estimated* budget - if that estimate is ever even slightly
				// off from how a given browser/environment actually renders (font metrics,
				// sub-pixel rounding), the bordered box gets capped there while the actual
				// rows keep extending past it, making the border look like it cuts through
				// the middle of the table instead of wrapping around all of it. Letting the
				// box size itself to its real content means the border is always aligned
				// with exactly the rows that are actually in it, regardless of estimate drift.

				const bodyTable = document.createElement('table');
				bodyTable.className = 'body-table';
				bodyTable.style.border = 'hidden';
				bodyTable.style.width = '100%';
				bodyTable.style.borderCollapse = 'collapse';
				// Without this, the browser's default "auto" table layout redistributes
				// column widths based on *all* rows' content collectively - so a long
				// narration added several rows later can retroactively shift column widths,
				// making the per-row height measurements taken during incremental
				// construction (below) stale by the time the full table exists. Fixed
				// layout locks column widths to the header's percentages from the first
				// row, so what's measured while building matches what's actually rendered.
				bodyTable.style.tableLayout = 'fixed';

				const thead = document.createElement('thead');
				const headerRow = document.createElement('tr');

				// Creating table headers
				// These 7 always-visible columns sum to 95%, plus Journal ID's 5% (shown
				// only when show_journal_id is on) makes exactly 100%. They used to sum to
				// 101% even without Journal ID - harmless under the browser's default
				// table-layout: auto (which treats these as hints and redistributes), but
				// table-layout: fixed (needed elsewhere to keep row-height measurements
				// stable) honors them strictly, so that 1% overflow was clipping the right
				// edge of the last column.
				const headers = [
					{ name: "Date", width: "13%" },
					{ name: "Journal ID", width: "5%", show: jsonData.config.show_journal_id },
					// "By/To" as a single unbroken token (no space for the browser to wrap at)
					// is wider than this column at any real font size, so it overflowed into
					// the "Type" header next to it. The <br> forces it onto two lines instead
					// of relying on the browser to find a break point in "By/To" (data rows
					// only ever contain the short "By"/"To" on its own, so they were never
					// affected).
					{ name: "By/<br>To", width: "3%" },
					{ name: "Type", width: "5%" },
					{ name: "Account Name", width: "39%" },
					{ name: "Debit", width: "10%" },
					{ name: "Credit", width: "10%" },
					{ name: "Balance", width: "15%" }
				];

				headers.forEach((header) => {
					if (header.show === undefined || header.show) {
						const th = document.createElement('th');
						th.innerHTML = header.name;
						if (jsonData.config.main_table_border == false) {
							th.style.borderTop = 'hidden';
							th.style.borderLeft = 'hidden';
							th.style.borderRight = 'hidden';
							th.style.borderBottom = '1px solid black';
						}
						else {
							th.style.border = '1px solid black';
						}
						th.style.textAlign = 'center';
						th.style.width = header.width;
						headerRow.appendChild(th);
					}
				});

				thead.appendChild(headerRow);
				bodyTable.appendChild(thead);

				tbody = document.createElement('tbody');
				bodyTable.appendChild(tbody);
				bodySection.appendChild(bodyTable);
				currentPage.appendChild(bodySection);

				headerHeight = thead.getBoundingClientRect().height;
				adjustedMaxHeight = maxHeight - headerHeight - middleGap;
				return { bodySection, bodyTable };
			}

			// Create a new page and initialize header and footer
			function createNewPageWithHeaderFooter() {
				currentPage = createNewPage(); // Assume createNewPage is defined elsewhere
				currentPageCount++;
				addSectionToPage(currentPage, generateHeaderSection, jsonData, false); // Assume generateHeaderSection is defined
				addSectionToPage(currentPage, generateFooterSection, jsonData, currentPageCount); // Assume generateFooterSection is defined
				return setupBodySection();
			}

			// Add a row to the table
			function addRow(item) {
				const tableRow = document.createElement('tr');

				// Populate each cell dynamically
				const columns = [
					{ value: item.journal_date, textAlign: 'center' },
					{ value: jsonData.config.show_journal_id ? item.journal_unique_id : null, textAlign: 'center' },
					{ value: item.by_to, textAlign: 'center' },
					{ value: item.voucher_type, textAlign: 'left' },
					{
						// Combine `by_to_account_name`, `det_ac_name`, and `det_amount`
						value: generateByToAccountNameContent(item),
						textAlign: 'left'
					},
					{ value: indianFormat(item.dr_amount), textAlign: 'right' },
					{ value: indianFormat(item.cr_amount), textAlign: 'right' },
					{ value: indianFormat(item.balance), textAlign: 'right' }
				];

				let maxRowHeight = 0; // To calculate the maximum height of this row

				columns.forEach((column) => {
					if (column.value !== null && column.value !== undefined) {
						const td = document.createElement('td');
						td.innerHTML = column.value;
						td.style.textAlign = column.textAlign;
						td.style.width = 'auto';

						if (jsonData.config.main_table_border == false) {
							td.style.border = 'hidden';
						}
						else {
							td.style.border = '1px solid black';
						}
						td.style.verticalAlign = 'top'; // Align to the top for multi-line content
						tableRow.appendChild(td);

						// Append the row temporarily to measure height
						tbody.appendChild(tableRow);
						const cellHeight = td.getBoundingClientRect().height;
						if (cellHeight > maxRowHeight) {
							maxRowHeight = cellHeight;
						}
						tbody.removeChild(tableRow); // Remove to avoid premature rendering
					}
				});

				tbody.appendChild(tableRow); // Re-append the row after calculating height




				// Adjust total height of the current page
				currentHeight += maxRowHeight;

				// Handle pagination
				if (currentHeight > adjustedMaxHeight) {
					tbody.removeChild(tableRow);
					({ bodySection, bodyTable } = createNewPageWithHeaderFooter());
					tbody = bodyTable.querySelector('tbody');
					tbody.appendChild(tableRow);
					currentHeight = maxRowHeight;
				}
			}

			// Helper function to generate content for `by_to_account_name` column
			function generateByToAccountNameContent(item) {
				// Split `det_ac_name` and `det_amount` by '\n'
				const accountNames = item.det_ac_name ? item.det_ac_name.split('\n') : [];
				const amounts = item.det_amount ? item.det_amount.split('\n') : [];
				let rowContent;

				if (item.view_order == 1) {
					// Initialize content for the rows
					rowContent = item.by_to_account_name + "<br>";

					// Loop through account names and amounts
					for (let j = 0; j < accountNames.length; j++) {
						rowContent += `
							<div style="display: flex; justify-content: space-between; margin-left: 20px;">
								<span>${accountNames[j] || '-'}</span>
								<span>${amounts[j] || '-'}</span>
							</div>`;
					}
					// Append the narration after the loop
					if (item.narration) {
						rowContent += `<div style="font-style: italic; font-size: 12px;">
							${item.narration}
						</div>`;
					}
				}
				else if (item.view_order == 0) {
					rowContent = item.by_to_account_name +
						`<div style= "font-style: italic; font-size: 12px;">
                         ${item.narration}
                </div>`;

				}

				return rowContent;
			}

			// Initialize the first page
			let { bodySection, bodyTable } = setupBodySection();

			// Loop through items and add rows
			items.forEach((item) => addRow(item));

			// Add subtotal and other rows as necessary (optional)
		}

		// SECTION 2: Header Section
		function generateHeaderSection(page, data, isFirstPage) {

			//main div
			var dfloatnum = document.createElement('div');
			dfloatnum.id = 'Float_num';
			dfloatnum.className = 'FloatNum';
			dfloatnum.style.top = "0px";

			// add div1
			var dfloatleft = document.createElement('div');
			dfloatleft.className = 'FloatLeft';

			var floatLefth5 = document.createElement("h5");
			floatLefth5.style.top = "0px";

			if (data.company_details.be_phone != '' && data.company_details.be_gstin == '') {
				floatLefth5.innerHTML = "<b><div class='beName'>" + data.company_details.be_name + "</div></b><br>" + data.company_details.be_addline1 + " " + data.company_details.be_addline2 + " " + data.company_details.be_state + " " + data.company_details.be_pin + "<br>Phone Number: " + data.company_details.be_phone;
				dfloatleft.appendChild(floatLefth5);
			}
			else if (data.company_details.be_phone == '' && data.company_details.be_gstin != '') {
				floatLefth5.innerHTML = "<b><div class='beName'>" + data.company_details.be_name + "</div></b><br>" + data.company_details.be_addline1 + " " + data.company_details.be_addline2 + " " + data.company_details.be_state + " " + data.company_details.be_pin + "<br><b>GSTIN: " + data.company_details.be_gstin + "</b>";
				dfloatleft.appendChild(floatLefth5);
			}
			else if (data.company_details.be_phone != '' && data.company_details.be_gstin != '') {
				floatLefth5.innerHTML = "<b><div class='beName'>" + data.company_details.be_name + "</div></b><br>" + data.company_details.be_addline1 + " " + data.company_details.be_addline2 + " " + data.company_details.be_state + " " + data.company_details.be_pin + "<br>Phone Number: " + data.company_details.be_phone + "<br><b>GSTIN: " + data.company_details.be_gstin + "</b>";
				dfloatleft.appendChild(floatLefth5);
			}
			else if (data.company_details.be_phone == '' && data.company_details.be_gstin == '') {
				floatLefth5.innerHTML = "<b><div class='beName'>" + data.company_details.be_name + "</div></b><br>" + data.company_details.be_addline1 + " " + data.company_details.be_addline2 + " " + data.company_details.be_state + " " + data.company_details.be_pin;
				dfloatleft.appendChild(floatLefth5);
			}


			//add div2
			var dfloatright = document.createElement('div');
			dfloatright.className = 'FloatRight';

			var floatrightp = document.createElement("p");
			floatrightp.className = 'floatrightp';
			floatrightp.innerHTML = "Account Ledger<br>From: " + data.other.from_date + " to " + data.other.to_date;
			floatrightp.style.marginTop = '-60';
			floatrightp.style.textAlign = 'right';
			dfloatright.appendChild(floatrightp);

			//line
			var hrlinr = document.createElement("hr");
			hrlinr.style.marginTop = "18";
			hrlinr.style.border = "1px solid";
			hrlinr.style.width = "95%";

			//creating heading of page
			var headingName = document.createElement('div');
			headingName.className = 'Hname';

			var hName = document.createElement("h4");

			hName.style.textAlign = 'center';
			hName.style.fontSize = '17px';
			hName.style.fontWeight = 'bold';
			hName.innerHTML = "Account: " + data.accounts.account_name;
			headingName.appendChild(hName);


			//appending it to main div
			dfloatnum.appendChild(dfloatleft);
			dfloatnum.appendChild(dfloatright);
			dfloatnum.appendChild(hrlinr);
			dfloatnum.appendChild(headingName);

			// Finally, append the table to the page
			page.appendChild(dfloatnum);

		}

		// SECTION 4: Footer Section
		function generateFooterSection(page, footerData, pageNumber) {

			// Create the main footer container
			var footerSection = document.createElement('div');
			footerSection.style.position = 'absolute'; // Fix footer at the bottom of the page
			footerSection.style.bottom = '0'; // Align footer to the bottom
			footerSection.style.left = '0'; // Align to the left
			footerSection.style.width = '97%'; // Full width of the page
			footerSection.style.display = 'flex'; // Flexbox for alignment
			footerSection.style.justifyContent = 'space-between'; // Space between elements
			footerSection.style.alignItems = 'center'; // Vertically align items
			footerSection.style.backgroundColor = '#fff'; // White background

			// Date and Time Section
			var dateTimeDiv = document.createElement('div');
			dateTimeDiv.style.width = '50%'; // Occupies half the width
			dateTimeDiv.style.textAlign = 'left'; // Align text to the left

			var dateTimeText = document.createElement('p');
			dateTimeText.className = 'footer1'; // Add a class for styling
			dateTimeText.id = 'foot1';

			var today = new Date();
			var date = today.getDate() + '-' + (today.getMonth() + 1) + '-' + today.getFullYear();
			var hours = today.getHours();
			var minutes = today.getMinutes();
			var seconds = today.getSeconds();
			var amOrPm = hours >= 12 ? 'PM' : 'AM';
			hours = hours % 12 || 12; // Convert 24-hour time to 12-hour
			minutes = minutes < 10 ? '0' + minutes : minutes;
			seconds = seconds < 10 ? '0' + seconds : seconds;

			var dateTime = `${date} ${hours}:${minutes}:${seconds} ${amOrPm}`;
			dateTimeText.innerHTML = dateTime;

			dateTimeDiv.appendChild(dateTimeText);

			// Page Number Section
			var pageNumberDiv = document.createElement('div');
			pageNumberDiv.style.width = '50%'; // Occupies half the width
			pageNumberDiv.style.textAlign = 'right'; // Align text to the right

			var pageText = document.createElement('p');
			pageText.className = 'footer2'; // Add a class for styling
			pageText.innerHTML = `Page No: ${pageNumber}`;

			pageNumberDiv.appendChild(pageText);

			// Append both sections to the footer
			footerSection.appendChild(dateTimeDiv);
			footerSection.appendChild(pageNumberDiv);

			// Append the footer to the page
			page.appendChild(footerSection);


		}


		// Shrinks each page to fit the available screen width, like how a PDF viewer
		// auto-fits a document to a phone screen - purely a visual scale (CSS transform),
		// so the actual data/pagination decided by generateSingleCopy() is completely
		// untouched. Never scales up past 100%, only down, so it never affects wide/desktop
		// screens where the page already fits.
		function applyResponsiveScale() {
			const frames = document.querySelectorAll('.page-frame');
			frames.forEach((frame) => {
				const page = frame.querySelector('.page');
				if (!page) {
					return;
				}
				// Reset before measuring, so repeated calls always measure the page's true
				// natural size rather than compounding an already-applied scale.
				page.style.transform = 'none';
				frame.style.width = '';
				frame.style.height = '';

				const naturalWidth = page.getBoundingClientRect().width;
				const naturalHeight = page.getBoundingClientRect().height;
				// A small safety margin (rather than the exact measured width) absorbs the
				// vertical scrollbar that a tall multi-page document needs - its width isn't
				// always reflected yet in clientWidth at the exact moment this measures,
				// which could otherwise leave a few px of horizontal overflow.
				const availableWidth = document.documentElement.clientWidth - 20;
				const scale = Math.min(1, availableWidth / naturalWidth);

				page.style.transform = `scale(${scale})`;
				page.style.transformOrigin = 'top left';
				// A CSS transform doesn't change the element's own layout box, so without
				// this the frame would still occupy the page's full, unscaled width/height.
				frame.style.width = `${naturalWidth * scale}px`;
				frame.style.height = `${naturalHeight * scale}px`;
			});
		}

		// Run the main function to generate all copies
		generateSingleCopy();
		applyResponsiveScale();

		// Re-run pagination whenever the viewport actually changes size - this includes
		// browser/OS zoom changes, which fire a resize event since they change the
		// effective CSS pixel viewport. Without this, pagination is a one-time calculation
		// done at load: if the user zooms in/out *after* the report is already rendered
		// (not before, which was already handled), text can reflow slightly differently at
		// the new zoom (the same subpixel rounding issue fixed elsewhere, just triggered
		// live instead of at load), making the last row on a page grow taller than what was
		// originally budgeted for - and since the footer sits at a fixed position, that
		// growth pushes the row into/past it. generateSingleCopy() already resets and
		// rebuilds from scratch (see the cleanup at its top), so re-running it here just
		// re-paginates against the new zoom's real measurements. applyResponsiveScale()
		// runs after so a narrow window still just shrinks to fit rather than scrolling.
		let resizeRegenerateTimer;
		window.addEventListener('resize', () => {
			clearTimeout(resizeRegenerateTimer);
			resizeRegenerateTimer = setTimeout(() => {
				generateSingleCopy();
				applyResponsiveScale();
			}, 200);
		});

		// Printing is a separate rendering pass that generally ignores whatever on-screen
		// zoom is active (it renders at its own scale, ignoring live document zoom) - so a
		// page grouping calibrated for the current screen zoom (see the resize handler
		// above) doesn't necessarily match how many rows actually fit once the browser
		// switches to print layout. By the time 'beforeprint' fires, the browser has
		// already applied print-specific layout, so re-measuring and regenerating here
		// calibrates pagination against what will actually be printed, not whatever the
		// screen happened to be showing beforehand.
		window.addEventListener('beforeprint', () => {
			generateSingleCopy();
		});
	</script>
