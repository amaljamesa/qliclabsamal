[build]
  command = "npm run build"
  publish = "dist/qliclabs-app/browser"

# Proxies API calls through the Netlify domain so the browser sees a same-origin
# request (no CORS) and never has to know the Render backend's real URL.
[[redirects]]
  from = "/api/*"
  to = "https://qliclabsamal.onrender.com/api/:splat"
  status = 200
  force = true

# Angular SPA fallback — client-side routes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
