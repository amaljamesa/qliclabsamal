<html>

<head>
    <meta charset="utf-8">
    <title>Transaction Wise Total Values</title>

    <style>
        body {
            background: #f0f0f0;
            margin: 0;
        }

        /* A4 exactly, with zero margin, and it has to stay that way - the .page height below
           has to match it too.

           The page-break-after rules further down never reach the print job when this report is
           embedded in a preview: the host document treats the iframe as one tall box and slices
           it every sheet-height, so pages coincide with sheets only while the two heights are
           equal. Measured rather than assumed - printing four pages against a deliberately
           different sheet height produced six sheets.

           This was declared 29cm against A4's 29.7, which held only while the browser honoured
           the custom size. Whenever the paper's own height won instead, every sheet slid 26.5px
           (0.7cm - about the height of the footer) further out of step, and the bottom of each
           page printed above the top of the next one. At A4 the custom size and the paper agree,
           so there is nothing left to drift. */
        @page {
            size: 21cm 29.7cm;
            margin: 0;
        }

        .page {
            background: white;
            width: 21cm;
            height: 29.7cm;
            /* Keeps the 10px top padding set in JS inside the declared size rather than
               adding to it, so the preview wrapper's sizing math (pageCount x 29.7cm) matches
               what really renders. */
            box-sizing: border-box;
            margin: 0 auto;
            box-shadow: 0 0 0.1cm rgba(0, 0, 0, 0.5);
            margin-bottom: 0.5cm;
            display: block;
            page-break-after: always;
            overflow: hidden;
        }

        /* Without this the truly-last page also gets page-break-after: always with nothing
           left to flow onto it - Chrome still honors that as a forced break and prints a
           genuine blank trailing sheet. */
        .page:last-child {
            page-break-after: auto;
        }

        @media print {

            body {
                height: auto;
                margin: 0;
                background: white;
            }

            .page {
                margin: 0;
                box-shadow: none;
                background: white;
                page-break-after: always;
            }

            .page:last-child {
                page-break-after: auto;
            }

            .FloatNum {
                width: 100%;
            }

            .Dfoot {
                bottom: 0px;
                width: 100%;
            }

            /* Without this, the print engine can slice a row's multi-line cell content
               across a physical page boundary when the printed dimensions diverge slightly
               from the JS's row-count budget. */
            tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .no-print {
                display: none
            }
        }

        /* header */
        h5 {
            text-align: left;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            margin-right: 15px;
            margin-left: 25px;
            font-weight: normal;
        }

        .floatrightp {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            margin-right: 50px;
        }

        .footer2,
        .footer1 {
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        /* Table */

        table,
        th {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 2%;
            margin-top: 5%;
        }

        td {
            font-size: 13px;
        }

        /* The line box is pinned rather than left to `normal`, which is what makes a row the
           same height at every zoom level. Left to itself Chrome derives it from the font's own
           metrics and rounds to device pixels, so the same row measures 17px at 100%, 15.74px at
           80% and 16.67px at 75% - and since pagination budgets rows against a fixed A4 page,
           an 80% preview packed five more rows onto a sheet than the printout (rendered at 100%
           regardless of zoom) has room for. 15px is exactly what `normal` already computes to
           here at 100%, so this changes nothing about how the report looks or how many rows fit
           on a sheet - it only stops the answer moving when someone zooms. */
        #maintable td,
        #maintable th {
            line-height: 15px;
        }

        /* No gaps between cells, and this is load-bearing rather than cosmetic. The default 2px
           of border-spacing is rounded to device pixels like everything else, so it measured 2px
           at 100% zoom and 1.333px at 75% - and because it sits between every pair of rows AND
           every pair of columns, that difference moved both the row heights and the column
           widths, which moved the wrapping, which moved the page breaks. Zero has nothing to
           round. */
        #maintable {
            border-spacing: 0;
        }

        /* A single long unbroken name (no spaces to wrap at) would otherwise force its column
           wider than the declared 45% and shove the Amount column off the sheet. Breaking
           mid-word keeps the column at its intended width - the row just gets taller, which
           the measured pagination in body() now accounts for.

           Scoped to the name cell rather than every td: applied to all of them it also broke
           bill numbers ("HO/S/26/000" / "01" on two lines), which are narrow enough to need
           the opposite treatment. */
        td.buyer-name {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* The reference and date are fixed-format and always fit - keeping them on one line
           stops a mid-page column-width shift from wrapping them. */
        td.no-wrap {
            white-space: nowrap;
        }

        th {
            font-weight: bold;
            font-size: 14px;
        }

        /* Footer */
        .footer1 {
            margin-left: 5%;
        }

        .sub-address {
            font-size: 12px;
        }

        .d_footer_grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            justify-content: space-between;
        }

        .spacer {
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <!-- -----------------------------header----------------------------------------------- -->

    <script src="../../../assets/js/report-scope.js"></script>
    <script src="../../../assets/js/report-payload.js"></script>
    <script src="../../../assets/js/report-textwrap.js"></script>
    <script src="../../../assets/js/report-zoom.js"></script>

    <script>
        // Physical page size, declared once and reused everywhere it matters: the @page rule,
        // the .page CSS, and (read off the rendered element's data attributes) the preview
        // wrapper that embeds this file. One source of truth keeps the wrapper's sizing math
        // in step with the real rendered page.
        var CM_TO_PX = 96 / 2.54;
        // The table's own declared width, as a share of the page - `width: 90%` in buildMainTable.
        var TABLE_WIDTH_SHARE = 0.9;
        var PAGE_WIDTH_CM = 21;
        var PAGE_HEIGHT_CM = 29.7;

        var page_count = 0;
        var totalAmount = 0;
        var totalPages = 1;

        // Breathing room left between the last row and the footer.
        //
        // Pagination measures the report as it stands when generated, which is exact at that
        // moment - but printing does not use that moment. Chrome renders a print job at 100%
        // whatever the browser is zoomed to, and text metrics are not proportional across zoom
        // levels: measured on this report, one line box is 17px at 100% and 15.74px at 80%, so a
        // sheet that packed 40 rows in an 80% preview has room for only 35 of them on paper. The
        // five rows over are not pushed to the next sheet, they are painted past a page box that
        // is overflow:hidden and are simply gone - which is what "page one ends at 50, page two
        // starts at 53" was (Amal and Sabhya, Slack 2026-09-02).
        //
        // Pinning the line box in CSS removes most of that (40 rows becomes 36), but not all: how
        // wide a character renders shifts with zoom too, so a name that wraps onto two lines at
        // 100% can still fit on one at 80% and free up a row. There is no pinning a font's
        // advance widths, so the last row of clearance below is what covers the remainder.
        // 16 rather than the 8 it was: predicted row heights and rendered ones agree to about a
        // hundredth of a pixel, which is nothing per row and roughly 2px by the bottom of a page
        // of seventy. The gap absorbs that accumulation. It is a fixed cost per page, not a
        // per-row one, so it does not grow with the report.
        var FOOTER_SAFETY_PX = 16;

        var other = "";
        var company_details = "";
        var loading_list_details = "";


        function topdiv() {

            page = document.createElement("page");
            page.className = 'page';
            page.style.paddingTop = '10px';
            // Read by the preview wrapper (report-preview.component.ts) to size the embedding
            // iframe from a plain DOM read rather than a rendered measurement, which would be
            // distorted by whatever on-screen zoom/scale is currently applied.
            page.setAttribute('data-page-w-cm', String(PAGE_WIDTH_CM));
            page.setAttribute('data-page-h-cm', String(PAGE_HEIGHT_CM));

            Top_elements = document.createElement('div');
            Top_elements.className = 'Top';
            Top_elements.id = 'Top_elements';

            // NOTE: topdiv() runs once per page element created, so what stands here runs once
            // per page of the report. It used to be a storage read, a base64 decode and a
            // JSON.parse OF THE WHOLE PAYLOAD - repeated for every page, on every re-render, and
            // report-zoom.js re-renders on every zoom change. This is now a cached object read.
            var myArray = getReportPayload() || {};

            other = myArray.other;
            company_details = myArray.company_details;
            loading_list_details = myArray.loading_list_details;
        }

        //  -----------------------------header--------------------------------------------------------------------------------
        function header() {

            topdiv();

            //main div
            var dfloatnum = document.createElement('div');
            dfloatnum.id = 'Float_num';
            dfloatnum.className = 'FloatNum';
            dfloatnum.style.height = '8%';
            dfloatnum.style.top = "0px";

            // add div1
            var dfloatleft = document.createElement('div');
            dfloatleft.className = 'FloatLeft';

            var floatLefth5 = document.createElement("h5");
            floatLefth5.style.top = "0px";

            var addressLine = company_details.be_addline1 + " " + company_details.be_addline2 + " " + company_details.be_addline3 + " " + company_details.be_state + " " + company_details.be_pin;
            var phoneText = company_details.be_phone ? "<br>Phone Number: " + company_details.be_phone : "";
            var gstinText = company_details.be_gstin ? "<br><b>GSTIN: " + company_details.be_gstin + "</b>" : "";
            floatLefth5.innerHTML = "<b>" + company_details.be_name + "</b><br><p class='sub-address'>" + addressLine + phoneText + gstinText + "</p>";
            dfloatleft.appendChild(floatLefth5);

            //add div2
            var dfloatright = document.createElement('div');
            dfloatright.className = 'FloatRight';

            var floatrightp = document.createElement("p");
            floatrightp.className = 'floatrightp';
            var scopeLine = buildReportScopeLine(other);
            if (other.from_ref_no > "0" && other.to_ref_no > "0") {
                floatrightp.innerHTML = scopeLine + "Brief " + other.transaction_type + " Report<span class='spacer'></span>From Bill / Ref # &nbsp;&nbsp;" + other.from_ref_no + " to " + other.to_ref_no;
            }
            else {
                floatrightp.innerHTML = scopeLine + "Brief " + other.transaction_type + " Report<span class='spacer'></span><b>From " + other.from_date + " to " + other.to_date + "</b>";
            }
            // This block is pulled up to sit alongside the company address on the left, and the
            // offset has to account for how tall it is. The scope line adds a line to it, so
            // without the extra pull the title below reaches down into the table header - which
            // is exactly what happened on the first attempt at this.
            floatrightp.style.marginTop = scopeLine ? '-45px' : '-30px';
            floatrightp.style.textAlign = 'right';
            dfloatright.appendChild(floatrightp);

            //appending it to main div
            dfloatnum.appendChild(dfloatleft);
            dfloatnum.appendChild(dfloatright);

            //appending it to top div
            Top_elements.appendChild(dfloatnum);
            page.appendChild(Top_elements);
        }

        // The columns, and the share of the table each one takes. These used to be percentages
        // written straight onto the cells and left to table-layout:auto, which sizes a column to
        // the content it happens to hold - and does that sizing against the device scale, so the
        // name column came out 347.8px at 100% zoom and 351.5px at 90%. A column that changes
        // width wraps text differently, which moves a page break, which is the whole bug. The
        // shares are turned into fixed pixel widths in columnWidths() instead, computed from the
        // page's own cm width, so every zoom level gets the same columns.
        var COLUMN_SHARES = [8, 10, 10, 5, 45, 10];
        var COLUMN_TITLES = ['Sl No', 'Bill No', 'Date', 'Cash / Cr', " Buyer's Name", 'Amount'];

        function buildTableHeader() {
            var header_row = document.createElement('tr');
            var widths = columnWidths();
            var aligns = ['center', 'center', 'center', 'left', 'left', 'center'];
            var headers = COLUMN_TITLES.map(function (text, index) {
                return { text: text, align: aligns[index] };
            });
            headers.forEach(function (h, index) {
                var th = document.createElement('th');
                th.innerHTML = h.text;
                th.style.width = widths[index] + 'px';
                th.style.textAlign = h.align;
                th.style.borderTop = '2px solid black';
                th.style.borderBottom = '2px solid black';
                header_row.appendChild(th);
            });
            return header_row;
        }

        function buildMainTable() {
            var maintable = document.createElement('table');
            maintable.id = 'maintable';
            maintable.style.width = '90%';
            maintable.style.marginTop = '-5px';
            maintable.style.borderStyle = 'hidden';
            maintable.appendChild(buildTableHeader());
            return maintable;
        }

        //  -----------------------------Body---------------------------------------------------------------------------------

        // Opens the body of the page header() has just created, and puts that page into the
        // document straight away.
        //
        // Appending up front (rather than only once the page is full, as this used to) is what
        // makes the measured pagination below possible at all: an element that isn't in the
        // document has no layout, so getBoundingClientRect() reports zero for it. The footer
        // goes on now for the same reason - it has to be part of the layout the row budget is
        // measured against. Its "Page : x of y" text is a placeholder at this point; the real
        // numbers can't be known until the last page exists, and updateAllFooters() rewrites
        // every one of them at the end.
        function openPageBody() {
            var pageDiv = document.createElement('div');
            pageDiv.className = 'pageDiv';
            // The fixed height is what holds the footer at the same spot on every page. It is
            // kept deliberately - the overlap bug was never this box, it was rows being
            // allowed to spill past it.
            pageDiv.style.height = '87%';

            //creating div for table
            var mainTableDiv = document.createElement('div');
            mainTableDiv.className = 'maintablediv';
            mainTableDiv.style.marginTop = '-10px';

            var maintable = buildMainTable();

            mainTableDiv.appendChild(maintable);
            pageDiv.appendChild(mainTableDiv);
            Top_elements.appendChild(pageDiv);
            page.appendChild(Top_elements);
            document.body.appendChild(page);

            page_count++;
            footer();

            return { pageDiv: pageDiv, maintable: maintable, pageEl: page };
        }

        // True once the table has grown past the box reserved for it - i.e. the point at which
        // its rows would start painting over the footer sitting underneath.
        //
        // Compares real rendered edges rather than counting rows, which is the whole fix: a
        // row's height depends on how many lines its buyer's name wraps to, so no fixed
        // rows-per-page number can be right for every page. Comparing bottom edges also means
        // the table's own margins and header row are accounted for automatically, with nothing
        // to keep in sync by hand.
        // The line height and vertical padding a data row is built from. Read once off a real
        // rendered row rather than hard-coded, so they cannot drift from the CSS - and read from
        // the FIRST page only, because these are the numbers every later page is then budgeted
        // against. Both are pinned in CSS (see the line-height rule), so what is read here is the
        // same at any zoom.
        var ROW_LINE_HEIGHT_PX = 15;
        var ROW_VERTICAL_PADDING_PX = 2;
        // The gap the table leaves between one row and the next, matching the border-spacing
        // declared in the CSS above. Zero, and deliberately a constant rather than a value read
        // back from the page: the used value is rounded to device pixels, so reading it made
        // every number derived from it move with the zoom level.
        var ROW_SPACING_PX = 0;
        var HEADER_ROW_HEIGHT_PX = 0;
        var countNameLines = null;
        var countPaymentLines = null;

        // Every column's width in px, worked out from the page rather than measured off one.
        //
        // The table is 90% of a page that is a fixed 21cm, and border-spacing takes 2px between
        // each pair of columns, so what is left is shared out in the declared proportions. Every
        // term is a constant or a CSS length, so the answer is the same at every zoom - which is
        // the point, and the reason this is not simply read back from a rendered table.
        function columnWidths() {
            var tableWidth = PAGE_WIDTH_CM * CM_TO_PX * TABLE_WIDTH_SHARE;
            var spacing = ROW_SPACING_PX * (COLUMN_SHARES.length + 1);
            var usable = tableWidth - spacing;
            var total = COLUMN_SHARES.reduce(function (sum, share) { return sum + share; }, 0);
            return COLUMN_SHARES.map(function (share) { return (share / total) * usable; });
        }

        // Establishes the metrics pagination is run against: the name column's usable text
        // width, the font it is set in, and the row geometry above. One probe row, rendered and
        // removed - the widths themselves are computed, not measured, so nothing here depends on
        // the zoom the report happens to be generated at.
        function prepareRowMetrics(context) {
            var probe = buildDataRow({
                row_sl: 0, reference: '', date: '', paid_topay: 'Credit', 'Account Name': 'X', value: ''
            });
            context.maintable.appendChild(probe);

            var nameCell = probe.querySelector('td.buyer-name');
            var style = window.getComputedStyle(nameCell);

            var lineHeight = parseFloat(style.lineHeight);
            if (lineHeight > 0) {
                ROW_LINE_HEIGHT_PX = lineHeight;
            }
            // From the declared padding rather than a rendered row's height, which would fold in
            // however many lines that particular row happened to wrap to.
            ROW_VERTICAL_PADDING_PX = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

            var font = style.font || (style.fontSize + ' ' + style.fontFamily);
            var sidePadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
            var widths = columnWidths();

            countNameLines = createLineCounter(font, widths[4] - sidePadding, true);
            // No mid-word breaking on this one: it carries no overflow-wrap rule, so a word too
            // wide for the column overflows rather than splitting.
            countPaymentLines = createLineCounter(font, widths[3] - sidePadding, false);

            measureHeaderRow(context.maintable, widths);
            context.maintable.removeChild(probe);
            applyColumnWidths(context.maintable);
        }

        // The height of the column-header row, modelled rather than measured for the same reason
        // the data rows are: read back from the page it comes out 36px at 100% zoom and 34.2px at
        // 70%, and since it is what every page's budget starts from, that alone moved a page
        // break. "Cash / Cr" is the one that wraps, in a column of 5%.
        function measureHeaderRow(maintable, widths) {
            var th = maintable.rows[0].cells[0];
            var style = window.getComputedStyle(th);
            var font = style.font || (style.fontWeight + ' ' + style.fontSize + ' ' + style.fontFamily);
            var sidePadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
            var lineHeight = parseFloat(style.lineHeight) || ROW_LINE_HEIGHT_PX;

            var lines = 1;
            for (var i = 0; i < COLUMN_TITLES.length; i++) {
                var counter = createLineCounter(font, widths[i] - sidePadding, false);
                lines = Math.max(lines, counter(COLUMN_TITLES[i]));
            }

            HEADER_ROW_HEIGHT_PX = lines * lineHeight
                + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom)
                + parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
        }

        // Pins those widths onto a page's table. table-layout:fixed is what makes them binding -
        // left on auto the browser goes back to sizing columns to whatever that page's own rows
        // happen to contain, which is exactly the variation this removes.
        function applyColumnWidths(maintable) {
            var widths = columnWidths();
            maintable.style.tableLayout = 'fixed';
            var headerCells = maintable.rows[0].cells;
            for (var i = 0; i < headerCells.length && i < widths.length; i++) {
                headerCells[i].style.width = widths[i] + 'px';
            }
        }

        function buildDataRow(item) {
            var table_row = document.createElement('tr');

            var cells = [
                { value: Math.floor(item.row_sl), align: 'center' },
                { value: item.reference, align: 'left', className: 'no-wrap' },
                { value: item.date, align: 'center', className: 'no-wrap' },
                { value: item.paid_topay, align: 'left' },
                { value: item['Account Name'] != null ? item['Account Name'] : item.account, align: 'left', className: 'buyer-name' },
                { value: item.value, align: 'right', className: 'no-wrap' }
            ];

            cells.forEach(function (c) {
                var td = document.createElement('td');
                td.innerHTML = (c.value == null) ? '' : c.value;
                td.style.textAlign = c.align;
                td.style.borderStyle = 'hidden';
                td.style.verticalAlign = 'top';
                if (c.className) {
                    td.className = c.className;
                }
                table_row.appendChild(td);
            });

            return table_row;
        }

        function buildTotalRow() {
            var table_row_total = document.createElement('tr');

            var td_total = document.createElement('td');
            td_total.setAttribute('colspan', '6');
            td_total.style.textAlign = 'right';
            td_total.style.borderTop = '1px solid black';
            td_total.style.width = '100%';
            td_total.style.fontWeight = 'bold';
            td_total.innerHTML = totalAmount;
            table_row_total.appendChild(td_total);

            return table_row_total;
        }

        // How tall a row WILL be, worked out from the data rather than read back from the page.
        // This is what makes the page breaks identical at every zoom - see report-textwrap.js.
        //
        // The TALLEST cell decides the row, and two columns here can wrap: the buyer's name, and
        // the Cash / Cr column, which is narrow enough for "Credit" to take two lines. The
        // spacing the table leaves between rows counts too - it belongs to the table rather than
        // to any row, so it is invisible in a row's own height, and at 2px across thirty rows it
        // is four rows' worth of page.
        function predictRowHeight(item) {
            var name = item['Account Name'] != null ? item['Account Name'] : item.account;
            var lines = Math.max(countNameLines(name), countPaymentLines(item.paid_topay));
            return lines * ROW_LINE_HEIGHT_PX + ROW_VERTICAL_PADDING_PX + ROW_SPACING_PX;
        }

        // How much table there is room for before the footer. Both edges come off a page box
        // that is a fixed 29.7cm, so this is the same number at every zoom.
        function tableBudget(context) {
            return context.pageDiv.getBoundingClientRect().bottom
                - context.maintable.getBoundingClientRect().top - FOOTER_SAFETY_PX;
        }

        function body() {

            var context = openPageBody();
            prepareRowMetrics(context);

            var budget = tableBudget(context);
            var used = HEADER_ROW_HEIGHT_PX + 2 * ROW_SPACING_PX;

            for (var i = 0; i < loading_list_details.length; i++) {
                var predicted = predictRowHeight(loading_list_details[i]);

                // Decided BEFORE the row goes in, so nothing is ever measured mid-page. The
                // first data row is exempt: a name long enough to fill a page on its own would
                // otherwise be carried forward for ever.
                if (used + predicted > budget && context.maintable.rows.length > 1) {
                    header();
                    context = openPageBody();
                    applyColumnWidths(context.maintable);
                    used = HEADER_ROW_HEIGHT_PX + 2 * ROW_SPACING_PX;
                }

                context.maintable.appendChild(buildDataRow(loading_list_details[i]));
                used += predicted;
            }

            sumNumbers();

            // The total row is subject to the same budget - on a page that filled exactly, it
            // would otherwise be the thing that lands on top of the footer. One line, no name to
            // wrap, so its height is the plain single-line case.
            if (used + ROW_LINE_HEIGHT_PX + ROW_VERTICAL_PADDING_PX + ROW_SPACING_PX > budget
                && context.maintable.rows.length > 1) {
                header();
                context = openPageBody();
                applyColumnWidths(context.maintable);
            }
            context.maintable.appendChild(buildTotalRow());
        }

        // -------------------------------------------------------------Footer------------------------------------------------
        function footer() {

            updateTotalPages();

            //footer main div
            var d_footer = document.createElement('div');
            d_footer.className = 'Dfoot';
            d_footer.id = 'Dfooter';
            d_footer.style.bottom = "9px";

            //bottom line
            var hrlinr1 = document.createElement("hr");
            hrlinr1.style.width = "95%";
            hrlinr1.style.bottom = "0px";
            d_footer.appendChild(hrlinr1);

            var d_footer_grid = document.createElement('div');
            d_footer_grid.className = 'd_footer_grid';


            //Footer Date&Time

            var fdatetime = document.createElement("p");
            fdatetime.className = "footer1";
            fdatetime.id = "foot1";
            fdatetime.style.width = '70%';
            fdatetime.style.marginTop = '-1%';

            var today = new Date();
            var date = today.getDate() + '-' + (today.getMonth() + 1) + '-' + today.getFullYear();
            var hours = today.getHours();
            var minutes = today.getMinutes();
            var seconds = today.getSeconds();
            var amOrPm = 'AM';
            if (hours >= 12) { amOrPm = 'PM'; if (hours > 12) hours -= 12; }
            if (hours === 0) hours = 12;
            if (minutes < 10) {
                minutes = "0" + minutes;
            }
            if (seconds < 10) {
                seconds = "0" + seconds;
            }

            var dateTime = date + ' ' + hours + ':' + minutes + ':' + seconds + ' ' + amOrPm;
            fdatetime.innerHTML = dateTime;

            d_footer_grid.appendChild(fdatetime);

            //Footer pagecount
            var fpagecount = document.createElement("p");
            fpagecount.className = "footer2";
            fpagecount.style.width = '95%';
            fpagecount.style.textAlign = 'right';
            fpagecount.style.marginTop = '-1%';

            fpagecount.innerHTML = "Page : " + page_count + " of " + totalPages;
            d_footer_grid.appendChild(fpagecount);

            d_footer.appendChild(d_footer_grid)

            Top_elements.appendChild(d_footer);
        }

        // Rewrites every page's "Page : x of y" once the real total is known. The total isn't
        // knowable until the last page has been laid out, so the footers written during
        // pagination would otherwise all show a stale placeholder total.
        function updateAllFooters() {
            var pages = document.querySelectorAll('.page');
            pages.forEach(function (pg, idx) {
                var grid = pg.querySelector('.d_footer_grid');
                if (!grid) return;
                var counter = grid.querySelectorAll('p')[1];
                if (counter) {
                    counter.innerHTML = "Page : " + (idx + 1) + " of " + pages.length;
                }
            });
        }

        //--------------------------total pages of invoice-------------------------------------------------------------
        // A placeholder only. Pages are no longer a fixed 48 rows each - how many rows fit
        // depends on how many lines their names wrap to - so this estimate is not the real
        // total and is never shown to anyone: updateAllFooters() replaces every footer with
        // the true page count once the last page has been laid out.
        function updateTotalPages() {
            var totalItems = loading_list_details.length;
            var itemsPerPage = 48;
            totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
            return totalPages;
        }

        //------------------------------------get total sum of dr and cr ---------------------------------------------
        function sumNumbers() {
            totalAmount = 0;
            for (var i = 0; i < loading_list_details.length; i++) {
                if (loading_list_details[i].value !== null && loading_list_details[i].value !== undefined) {
                    var amount = Number(String(loading_list_details[i].value).replace(/,/g, ''));
                    if (!isNaN(amount)) {
                        totalAmount += amount;
                    }
                }
            }
            totalAmount = totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return totalAmount;
        }

    </script>

    <script>
        // Discards the rendered report and lays it out again from scratch.
        function render() {
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].remove();
            }
            // Only the .page elements are removed, never document.body's contents - the scripts
            // driving this report live in the body too.
            page_count = 0;

            // header() opens the first page; body() opens and footers every page after it, so
            // a standalone footer() call here would add a second footer to the last page.
            header();
            body();
            updateAllFooters();
        }

        // Resolves the payload once, then renders. Only this step can be async (the IndexedDB
        // fallback is); every rebuild after it reads the cached object synchronously, which is
        // what keeps the beforeprint rebuild safe.
        loadReportPayload('temp_sale_report', function () {
            try {
                render();
            } catch (error) {
                console.error('Error rendering the report payload:', error);
            }
        });

        // Re-paginates when the zoom level changes, which pagination has to be redone for -
        // see public/assets/js/report-zoom.js for why, and why a poll rather than an event.
        watchZoomAndRepaginate(render);
    </script>
