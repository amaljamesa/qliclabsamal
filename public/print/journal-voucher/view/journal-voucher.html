<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Journal Voucher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 0;
      margin: 0;
      font-size: 12px;
      background: #f0f0f0;
    }

    /* Sized to the true physical paper with zero margin. Without this, printing falls back
       to whatever default paper size the browser assumes (commonly Letter), which doesn't
       match this voucher's A4 page - the mismatch makes the browser's own print pagination
       slice one page in two, producing extra printed pages the preview never showed. */
    @page {
      size: 210mm 297mm;
      margin: 0;
    }

    .voucher {
      width: 210mm;
      height: 297mm;
      margin: 0 auto 0.5cm auto;
      padding: 15mm;
      /* Keeps the 15mm padding inside the declared 210x297mm rather than adding to it -
         otherwise every page renders ~30mm taller than the size the preview wrapper's
         sizing math assumes, and the error compounds across pages. */
      box-sizing: border-box;
      background: white;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
      position: relative;
      page-break-after: always;
      overflow: hidden;
    }

    /* Without this the truly-last page also gets page-break-after: always with nothing left
       to flow onto it - Chrome still honors that as a forced break and prints a genuine
       blank trailing sheet. */
    .voucher:last-child {
      page-break-after: auto;
    }

    .header {
      text-align: center;
    }

    .header h2,
    .header h3 {
      margin: 2px 0;
    }

    .details {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed;
    }

    th {
      text-align: center;
      font-weight: bold;
      padding: 6px 4px;
      border-top: 1px solid black;
      border-bottom: 1px solid black;
      border-right: 1px solid black;
    }

    th:first-child {
      border-left: 1px solid black;
    }

    td {
      padding: 4px 4px;
      vertical-align: top;
      border-right: 1px solid black;
    }

    td:first-child {
      border-left: 1px solid black;
    }

    th.particulars,
    td.particulars {
      width: 70%;
    }

    th.debit,
    td.debit {
      width: 15%;
    }

    th.credit,
    td.credit {
      width: 15%;
    }

    .total-row td {
      border-top: 1px solid black;
      font-weight: bold;
      border-right: 1px solid black;
    }

    .total-row td:first-child {
      border-left: 1px solid black;
    }

    tbody tr:last-child td {
      border-bottom: 1px solid black;
    }

    .text-right {
      text-align: right;
    }

    .bold {
      font-weight: bold;
    }

    .small {
      font-size: 11px;
    }

    .sign {
      margin-top: 60px;
      text-align: right;
      padding-right: 20px;
    }

    .sign-line {
      width: 180px;
      border-top: 1px solid black;
      margin-left: auto;
      margin-bottom: 4px;
    }

    .sign-label {
      font-size: 12px;
    }

    .page-footer {
      position: absolute;
      left: 15mm;
      right: 15mm;
      bottom: 8mm;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    @media print {
      html,
      body {
        width: auto;
        height: auto;
        background: white;
        margin: 0;
      }

      .voucher {
        box-shadow: none;
        margin: 0;
        page-break-after: always;
      }

      .voucher:last-child {
        page-break-after: auto;
      }

      /* Without this, the print engine can slice a row's multi-line cell content across a
         physical page boundary when the printed dimensions diverge slightly from the JS's
         height budget. */
      tr {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <script src="../../../assets/js/report-zoom.js"></script>

  <script>
    // Physical page size, declared once and reused everywhere it matters: the @page rule,
    // the .voucher CSS, and (read off the rendered element's data attributes) the preview
    // wrapper that embeds this file. One source of truth keeps the wrapper's sizing math in
    // step with the real rendered page.
    const PAGE_WIDTH_CM = 21;
    const PAGE_HEIGHT_CM = 29.7;
    // How many entry rows fit on a page before the totals/signature block. Deliberately
    // conservative so the fixed-height page never overflows and silently clips entries -
    // the original single-page layout had no pagination at all and did exactly that.
    const ROWS_PER_PAGE = 30;

    // UTF-8 safe decode. Plain atob() mangles any multi-byte character (it reads each byte
    // as its own code point), which is what turned the rupee sign into mojibake in the
    // original - this mirrors the same helper the other report layouts use.
    function base64ToUtf8(urlSafeBase64) {
      let base64 = urlSafeBase64.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) { base64 += '='; }
      const binaryString = atob(base64);
      const bytes = new Uint8Array([...binaryString].map((char) => char.charCodeAt(0)));
      return new TextDecoder().decode(bytes);
    }

    // Format date to 2-May-24 format
    function formatDateToDMY(dateStr) {
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr || '';
      const day = date.getDate();
      const month = date.toLocaleString('default', { month: 'short' });
      const year = date.getFullYear().toString().slice(-2);
      return `${day}-${month}-${year}`;
    }

    function formatAmount(value) {
      return value ? Number(value).toFixed(2) : '';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function chunk(list, size) {
      const out = [];
      for (let i = 0; i < list.length; i += size) {
        out.push(list.slice(i, i + size));
      }
      return out.length ? out : [[]];
    }

    function buildPage(entries, beb, meta, pageNumber, totalPages, isLastPage, totals) {
      const page = document.createElement('div');
      page.className = 'voucher page';
      // Read by the preview wrapper (report-preview.component.ts) to size the embedding
      // iframe from a plain DOM read rather than a rendered measurement, which would be
      // distorted by whatever on-screen zoom/scale is currently applied.
      page.setAttribute('data-page-w-cm', String(PAGE_WIDTH_CM));
      page.setAttribute('data-page-h-cm', String(PAGE_HEIGHT_CM));

      const rowsHtml = entries.map((entry, index) => {
        const isLastEntryOverall = isLastPage && index === entries.length - 1;
        const narration = isLastEntryOverall && entry.narration
          ? `<div class="small" style="margin-top:4px;">${escapeHtml(entry.narration)}</div>`
          : '';
        const drSuffix = entry.drcr === 'Debit' ? '<span style="float:right;">Dr</span>' : '';
        return `
          <tr>
            <td class="particulars">
              <div><strong>${escapeHtml(entry.byto)}</strong> ${escapeHtml(entry.account)}${drSuffix}</div>
              ${narration}
            </td>
            <td class="debit text-right"><strong>${formatAmount(entry.debit)}</strong></td>
            <td class="credit text-right"><strong>${formatAmount(entry.credit)}</strong></td>
          </tr>`;
      }).join('');

      // Totals and the signature block belong to the end of the document, not to every page.
      const totalsHtml = isLastPage ? `
          <tr class="total-row">
            <td></td>
            <td class="text-right"><strong>₹ ${totals.debit.toFixed(2)}</strong></td>
            <td class="text-right"><strong>₹ ${totals.credit.toFixed(2)}</strong></td>
          </tr>` : '';

      const signHtml = isLastPage ? `
        <div class="sign">
          <div class="sign-line"></div>
          <div class="sign-label">Authorised Signatory</div>
        </div>` : '';

      page.innerHTML = `
        <div class="header">
          <h2>${escapeHtml(beb.beb_name)}</h2>
          <div>${beb.beb_address || ''}${beb.beb_pin ? ' - ' + escapeHtml(beb.beb_pin) : ''}</div>
          ${beb.beb_phone ? `<div>Phone: ${escapeHtml(beb.beb_phone)}</div>` : ''}
          ${beb.beb_gstin ? `<div>GSTIN: ${escapeHtml(beb.beb_gstin)}</div>` : ''}<br>
          <h3>Journal Voucher</h3>
        </div>

        <div class="details">
          <div>No.: <strong>${escapeHtml(meta.no)}</strong></div>
          <div>Date: <strong>${escapeHtml(meta.date)}</strong></div>
        </div>

        <table>
          <thead>
            <tr>
              <th class="particulars">Particulars</th>
              <th class="debit text-right">Debit</th>
              <th class="credit text-right">Credit</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
            ${totalsHtml}
          </tbody>
        </table>

        ${signHtml}

        <div class="page-footer">
          <span>This is a Computer Generated Document</span>
          <span>Page : ${pageNumber} of ${totalPages}</span>
        </div>`;

      return page;
    }

    // Defensive reset so a re-run rebuilds from scratch instead of piling new pages up after
    // the old ones.
    function resetGeneratedContent() {
      document.querySelectorAll('.voucher').forEach((v) => v.remove());
    }

    function generateJournalVoucher() {
      const searchParams = new URLSearchParams(window.location.search);
      const message = searchParams.get('message');

      try {
        resetGeneratedContent();

        const stored = localStorage.getItem('journalVoucherData');
        let jsonData;
        if (stored !== null) {
          jsonData = JSON.parse(base64ToUtf8(stored));
        } else if (message) {
          jsonData = JSON.parse(base64ToUtf8(message));
        } else {
          console.error('No data found.');
          return;
        }

        const beb = jsonData.beb_details || {};
        const entries = Array.isArray(jsonData.journal_voucher_details)
          ? jsonData.journal_voucher_details
          : [];

        if (entries.length === 0) {
          console.error('No journal voucher entries to render.');
          return;
        }

        const totals = {
          debit: entries.reduce((sum, e) => sum + (e.debit || 0), 0),
          credit: entries.reduce((sum, e) => sum + (e.credit || 0), 0)
        };

        const meta = {
          no: entries[0].journal_unique_id || '',
          date: formatDateToDMY(entries[0].journal_date)
        };

        const pages = chunk(entries, ROWS_PER_PAGE);
        pages.forEach((pageEntries, index) => {
          const isLastPage = index === pages.length - 1;
          document.body.appendChild(
            buildPage(pageEntries, beb, meta, index + 1, pages.length, isLastPage, totals)
          );
        });
      } catch (error) {
        console.error('Error decoding or parsing JSON:', error);
      }
    }

    // The host preview page resizes THIS iframe's own box right before printing and back
    // again after, which fires a resize event in here indistinguishable from a real one.
    // Regenerating mid-print would race the host's own measurement of this document.
    let isPrinting = false;
    window.addEventListener('beforeprint', () => { isPrinting = true; });
    // Cleared on a delay rather than synchronously - the resize a print cycle triggers
    // arrives asynchronously, after a synchronous handler would already have cleared the
    // flag again, defeating the guard entirely.
    window.addEventListener('afterprint', () => {
      setTimeout(() => { isPrinting = false; }, 300);
    });

    generateJournalVoucher();

    // Pagination is measured against the zoom level in force when the report was built, so
    // a later zoom change has to rebuild it - see public/assets/js/report-zoom.js for the
    // detail, including why a zoom change is polled for rather than listened for.
    watchZoomAndRepaginate(generateJournalVoucher);
  </script>
</body>

</html>
