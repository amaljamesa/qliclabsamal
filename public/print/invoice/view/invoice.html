<html>

<head>
    <meta charset="utf-8">
    <title>EPrise</title>

    <script src="../../../assets/js/report-payload.js"></script>
    <script src="../../../assets/js/report-zoom.js"></script>

    <script type="text/javascript">
        function getQueryParam(param) {
            let searchParams = new URLSearchParams(window.location.search);
            return searchParams.get(param);
        }

        var deviceType = getQueryParam('device_type');
        var supportedDeviceTypes = ['1', '2', '6', '8'];

        document.write('<script type="text/javascript" src="../../../assets/js/qrcode.min.js"><\/script>');
        document.write('<script type="text/javascript" src="../../../assets/js/qrious.js"><\/script>');
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* box-sizing: border-box below matters more than it looks: without it, this
           padding is added ON TOP OF the explicit width/height createNewPage() sets
           (21cm/29.7cm), so a page's true rendered box ends up ~0.68cm taller than
           that - invisible for a single page, but compounds across a bulk print's
           several stacked pages until the outer iframe (sized in
           invoice-preview.component.ts from pageCount * this same 29.7cm figure) falls
           short of the real content height and shows its own internal scrollbar.
           border-box makes the padding come out of the declared size instead of
           adding to it, so 29.7cm means 29.7cm everywhere it's used. */
        .page {
            background: white;
            position: relative;
            margin: 0 auto;
            padding: 0.53cm 0.53cm 0.15cm 0.53cm;
            box-shadow: 0 0 0.5cm rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            page-break-after: always;
            overflow: hidden;
            box-sizing: border-box;
        }

        @media print {
            .page {
                height: auto;
                margin: 0;
                box-shadow: initial;
                background: initial;
                page-break-after: always;
            }

            /* Without this, the browser's print engine can slice a row's multi-line cell
               content across a physical page boundary if a page's true printed dimensions
               (after margins/DPI) diverge even slightly from the JS's height budget. */
            tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }

        .page:last-child {
            page-break-after: auto;
        }

        .imgwatermark {
            opacity: 0.10;
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 100;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .imgwatermark img {
            width: 7.94cm;
            height: 7.94cm;
            object-fit: contain;
        }

        h3, h4, p { margin: 0; }
        h5 { font-weight: normal; margin: 0; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .page-a4 th, .page-a4 td { font-size: 12px; }
        .page-other th, .page-other td { font-size: 11px; }

        th, td {
            border: 1px solid black;
            padding: 1px;
            font-size: 12px;
        }

        .header-title { text-align: center; font-size: 14px; }
        .header-subtitle { text-align: center; font-size: 12px; }

        /* Deliberately NOT a flex column. Its children are tables stacked vertically, which
           block layout already does - but as flex items those tables get a flex base size
           computed independently of how their rows finally lay out, and the rows can end up
           taller than the box the table was given. The overflow then spills past .body and
           paints over the footer that follows it: the HSN summary's "Total" row was sliced in
           half by the footer on both A4 and A5 (most visible on A5, where the block sits
           closer to the footer). Block layout sizes the table to its rows, so the two agree. */
        .body {
            display: block;
        }

        .body-table { width: 100%; }
        .body-table th, .body-table td { text-align: center; vertical-align: top; }

        /* The line box is pinned rather than left to `normal`, which is what stops a row's height
           moving with the browser's zoom. Left to itself Chrome derives it from the font's own
           metrics and rounds to device pixels, so the same row measured 16.5px at 100% zoom and
           15.87px at 90% - and since the rows are budgeted against a fixed page, a 90% preview
           put 51 lines on the first sheet where 100% puts 48. The pagination is decided from
           those measurements, so the sheet then had more on it than the budget had allowed for
           and the footer was pushed off the bottom, taking the date and page number with it
           (Priyanka, 2026-09-08).
           14px is exactly what `normal` already computes to here at 100%, so nothing about the
           printed page changes - it only stops the answer moving when someone zooms. Every cell
           in this table is 12px, so one value covers them. */
        .body-table th, .body-table td { line-height: 14px; }

        /* The widths set on these cells are pixel widths (see getColumnWidth), and they are meant
           as the whole column - border-box makes the padding and the cell borders count inside
           that figure rather than adding to it. Without it the columns sum past the page and the
           table renders wider than the sheet it is laid out for. */
        .body-table th, .body-table td { box-sizing: border-box; }

        /* Built incrementally, one row at a time, with per-row height measurements used to
           decide page breaks - table-layout:auto (the default) would recalculate column
           widths from all rows collectively as they're added, going stale mid-construction.
           These tables already give every row explicit inline % widths (unlike body-table,
           which needed the same fix applied in JS instead - see getColumnWidthPercent), so
           this is a defensive consistency measure rather than a fix for an observed bug. */
        .hsn-table, .arrears-table, .terms-table {
            table-layout: fixed;
        }

        .empty-row td {
            border-left: 1px solid black;
            border-right: 1px solid black;
            border-top: none;
            border-bottom: none;
            height: 0.53cm;
        }

        .tax-row td { text-align: left; border-right: none; }
        .tax-row td:last-child { text-align: right; border-left: none; }
        .total-row td { font-weight: bold; border-top: 1px solid black; text-align: right; }

        .amount-text {
            border: 1px solid black;
            margin-bottom: 0;
            font-size: 12px;
            text-align: left;
        }

        .hsn-section { margin-bottom: 0px; }

        .invoice-attribute-section {
            display: flex;
            border: 1px solid black;
        }

        .invoice-attribute-half {
            flex: 1;
            padding: 3px;
            border-right: 1px solid black;
        }

        .invoice-attribute-half:last-child { border-right: none; }

        .footer-section {
            border: 1px solid black;
            padding: 3px;
            text-align: left;
            font-size: 12px;
        }

        .qr-section { text-align: center; }

        .watermark {
            opacity: 0.25;
            position: absolute;
            top: 40%;
            left: 20%;
            font-size: 100px;
            transform: rotate(-30deg);
        }

        .tab {
            display: block;
            margin-left: 0.5em;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5px;
        }

        .tab-serial {
            display: block;
            margin-left: 1em;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <script>
        let isHSNSection = false;
        let isTermandConditionSection = false;
        var typeOfCopy = 0;
        let currentPageCount = 1;
        let jsonData;
        let pageSize;
        let isFirstPage = true;
        let maxHeight;
        // Track page indices per copy for per-copy page numbering
        let copyPageIndices = [];

        let _pxPerCm = null;
        function getPxPerCm() {
            if (_pxPerCm === null) {
                let ref = document.createElement('div');
                ref.style.width = '10cm';
                ref.style.height = '10cm';
                ref.style.position = 'absolute';
                ref.style.left = '-9999px';
                ref.style.top = '-9999px';
                ref.style.visibility = 'hidden';
                document.body.appendChild(ref);
                _pxPerCm = ref.getBoundingClientRect().height / 10;
                document.body.removeChild(ref);
            }
            return _pxPerCm;
        }

        function cmToPx(cm) {
            return cm * getPxPerCm();
        }

        function getPageContentHeightPx() {
            let heightCm = pageSize == 'a4' ? 29.7 : 21;
            let paddingCm = 0.53 + 0.15;
            return cmToPx(heightCm - paddingCm);
        }

        // Renders a throwaway footer off in the body purely to measure its real height, since
        // it's the same content/structure on every page of a given copy regardless of page
        // number - one measurement covers the whole copy. Previously this was a hardcoded cm
        // guess (3.1cm for A4, 2.3cm for A5), which measured 11-13px shorter than the real
        // footer (QR code + bank details + signature block stack taller than that guess
        // assumed) - so pagination packed rows into a budget that was already too generous
        // before the real footer ever got placed, then relying entirely on the later
        // clamp/shrink-to-fit safety nets to paper over the gap instead of getting the row
        // count right in the first place.
        let _footerReserveHeight = null;
        function getFooterReserveHeightPx() {
            if (_footerReserveHeight !== null) {
                return _footerReserveHeight;
            }
            let probe = document.createElement('div');
            probe.style.position = 'absolute';
            probe.style.left = '-9999px';
            probe.style.top = '-9999px';
            probe.style.visibility = 'hidden';
            probe.style.width = pageSize == 'a4' ? '21cm' : '14.8cm';
            document.body.appendChild(probe);
            generateFooterSection(probe, jsonData, jsonData.others, 1);
            let footerWrapper = probe.querySelector('.footer-wrapper');
            let measured = footerWrapper ? footerWrapper.getBoundingClientRect().height : null;
            document.body.removeChild(probe);
            // The measured height already includes the footer's own 0.15cm top padding (the
            // gap above it - see generateFooterSection), so only the long-standing 0.3cm of
            // slack is added here.
            _footerReserveHeight = (measured !== null ? measured : cmToPx(pageSize == 'a4' ? 3.1 : 2.3)) + cmToPx(0.3);
            return _footerReserveHeight;
        }

        function getElHeight(el) {
            if (!el) return 0;
            return el.getBoundingClientRect().height;
        }


        // getBoundingClientRect() (used inside getElHeight) forces a synchronous layout flush,
        // so the header sections appended just above are already accurately measurable here -
        // no need to wait/poll across animation frames for a non-zero height.
        function measureHeaderHeights(currentPage) {
            const headerAddSection = currentPage.querySelector('.maintable');
            const headerEinvoiceSection = currentPage.querySelector('.mainEinvoicetable');
            const invoiceAttributeSection = currentPage.querySelector('.invoice-attribute-section');

            return {
                headerAddHeight: headerAddSection ? getElHeight(headerAddSection) : 0,
                headerEinvoiceHeight: headerEinvoiceSection ? getElHeight(headerEinvoiceSection) : 0,
                invoiceAttributeHeight: invoiceAttributeSection ? getElHeight(invoiceAttributeSection) : 0
            };
        }

        // jsonData/pageSize are set by the caller (generateReport) before this runs, rather
        // than decoded here - one invoice's payload can produce several copies (Original/
        // Duplicate/etc, see jsonData.copies), all sharing the same underlying data, and a
        // bulk print run calls this once per copy per invoice in the batch (see generateReport).
        function generateSingleCopy(copy) {
            try {
                const container = document.querySelector('body');
                container.classList.add(pageSize == 'a4' ? 'page-a4' : 'page-other');

                // Record starting page index for this copy
                let startPageIndex = document.querySelectorAll('.page').length;

                let currentPage = createNewPage();
                let localPageNumber = currentPageCount;

                addSectionToPage(currentPage, generateHeaderSection, jsonData, isFirstPage);
                addSectionToPage(currentPage, generateInvoiceAttributeSection, jsonData);

                const { headerAddHeight, headerEinvoiceHeight, invoiceAttributeHeight } = measureHeaderHeights(currentPage);

                const pageContentHeight = getPageContentHeightPx();
                const footerReserve = getFooterReserveHeightPx();
                const usedHeight = headerAddHeight + headerEinvoiceHeight + invoiceAttributeHeight + footerReserve;
                maxHeight = pageContentHeight - usedHeight;

                generateBodySectionWithPagination(currentPage, jsonData, jsonData.product_columns, jsonData.items, maxHeight);

                // Record ending page index for this copy
                let endPageIndex = document.querySelectorAll('.page').length;
                copyPageIndices.push({ start: startPageIndex, end: endPageIndex });

            } catch (error) {
                console.error('Error generating copy:', error);
            }
        }

        function createNewPage() {
            let newPage = document.createElement('div');
            newPage.className = 'page';
            newPage.style.position = 'relative';
            newPage.style.pageBreakBefore = 'always';

            if (pageSize == 'a4') {
                newPage.style.width = "21cm";
                newPage.style.height = "29.7cm";
            } else if (pageSize == 'a5') {
                newPage.style.width = "14.8cm";
                newPage.style.height = "21cm";
            }

            if (jsonData.config.is_canceled == true) {
                cancelWatermark(newPage);
            }

            addLogoWatermark(newPage);
            document.body.appendChild(newPage);
            return newPage;
        }

        function addSectionToPage(currentPage, sectionFunc, ...args) {
            let tempSection = document.createElement('div');
            sectionFunc(tempSection, ...args);
            currentPage.appendChild(tempSection);
            return getElHeight(tempSection);
        }

        function cancelWatermark(page) {
            var watermark = document.createElement('div');
            watermark.id = 'watermark';
            watermark.className = 'watermark';
            watermark.style.fontFamily = 'Arial, Helvetica, sans-serif';
            watermark.innerHTML = 'Cancelled';
            page.appendChild(watermark);
        }

        // Helper: get per-copy page number for a given global page index
        function getCopyPageNumber(globalIndex) {
            for (let c = 0; c < copyPageIndices.length; c++) {
                if (globalIndex >= copyPageIndices[c].start && globalIndex < copyPageIndices[c].end) {
                    return globalIndex - copyPageIndices[c].start + 1;
                }
            }
            // Page belongs to current copy (not yet recorded in copyPageIndices)
            if (copyPageIndices.length > 0) {
                let lastCopy = copyPageIndices[copyPageIndices.length - 1];
                if (globalIndex >= lastCopy.end) {
                    return globalIndex - lastCopy.end + 1;
                }
            }
            return globalIndex + 1; // fallback
        }

        // SECTION 1: Body Section
        function generateBodySectionWithPagination(currentPage, jsonData, product_columns, items, maxHeight) {
            let tbody, hsnTbody, bodySection;
            let currentHeight = 0;
            let subtotal = 0;
            let headerHeight = 0;
            let adjustedMaxHeight = 0;
            const middleGap = cmToPx(pageSize == 'a4' ? 0.05 : 0.05);
            let hsn = false;
            // Set when the total row did not fit under the last item and was carried onto a page
            // of its own. That page then has to be padded out like any other - see
            // fillCarriedTotalPage.
            let totalCarriedToNewPage = false;

            // Base proportions for each possible column. Actual invoices only ever show a
            // subset of these (product_columns is configurable per business/invoice), so
            // getColumnWidthPercent() below normalizes whichever subset is present to sum to
            // exactly 100% - fixing two related bugs: (1) these widths were previously defined
            // but never actually applied anywhere (every <td> hardcoded style.width = 'auto'
            // regardless), and (2) with table-layout left at the browser's default "auto",
            // the table recalculated column widths from ALL rows collectively as they were
            // added - so a row's height, measured right after it was appended (used to decide
            // page breaks), could go stale the moment a later row's content (e.g. a long
            // product name) forced a retroactive width/wrap change in an earlier row's column.
            // Confirmed empirically: a 7-column layout's "Description of Goods" column
            // measured 313px after row 1 was added, then jumped to 599px once a long-named
            // row 15 was added - invalidating every row height counted before that point.
            const columnStyles = {
                sl_no: { width: '2%', textAlign: 'center' },
                marks_nos_container: { width: '3%', textAlign: 'center' },
                no_pkgs: { width: '3%', textAlign: 'center' },
                pro_code: { width: '10%', textAlign: 'center' },
                pro_barcode: { width: '10%', textAlign: 'center' },
                pro_name: { width: '50%', textAlign: 'left' },
                bra_name: { width: '10%', textAlign: 'center' },
                batch: { width: '10%', textAlign: 'center' },
                mfg_date: { width: '10%', textAlign: 'center' },
                exp_date: { width: '10%', textAlign: 'center' },
                hsn: { width: '4%', textAlign: 'center' },
                tax_rate: { width: '4%', textAlign: 'center' },
                alt_qty: { width: '5%', textAlign: 'right', paddingRight: '5px' },
                qty: { width: '5%', textAlign: 'right', paddingRight: '5px' },
                free_qty: { width: '5%', textAlign: 'right', paddingRight: '5px' },
                unit: { width: '5%', textAlign: 'center' },
                mrp: { width: '8%', textAlign: 'right', paddingRight: '5px' },
                rate: { width: '8%', textAlign: 'right', paddingRight: '5px' },
                rate_post_tax: { width: '8%', textAlign: 'right', paddingRight: '5px' },
                rate_pre_tax: { width: '8%', textAlign: 'right', paddingRight: '5px' },
                per: { width: '4%', textAlign: 'center' },
                disc1_per: { width: '5%', textAlign: 'center' },
                disc1_amt: { width: '8%', textAlign: 'right', paddingRight: '5px' },
                disc2_per: { width: '5%', textAlign: 'center' },
                disc2_amt: { width: '8%', textAlign: 'right', paddingRight: '5px' },
                amount: { width: '10%', textAlign: 'right', paddingRight: '5px' }
            };
            const columnBaseWidth = (name) => {
                const style = columnStyles[name];
                return style ? parseFloat(style.width) : 100 / product_columns.length;
            };
            const totalBaseWidth = product_columns.reduce((sum, col) => sum + columnBaseWidth(col.name), 0);

            // The share above, resolved to PIXELS against the page's own declared width rather
            // than handed to the browser as a percentage.
            //
            // A percentage is resolved against the table's used width, and that resolution is
            // rounded to device pixels - which move with the browser's zoom. Measured on the
            // 68-line demo, the description column came out 494.91px at 100% zoom and 493.96px at
            // 75%, and the columns either side moved with it. Under a tenth of a percent, but a
            // cell whose content only just fits is decided by exactly that: the same quantity
            // sat on one line at one zoom and broke into "1157" and "6" at another, and the
            // amount column lost the end of its figure (Priyanka, 2026-09-09).
            //
            // The page is a fixed 21cm (14.8 for A5) less its 0.53cm side padding, and a CSS
            // centimetre is a fixed number of CSS pixels, so this width is the same at every zoom
            // and so are the columns computed from it.
            // The CSS specification's fixed ratio, not getPxPerCm() - that measures a rendered
            // 10cm box, and the measurement is itself rounded to device pixels, which is the
            // very thing being designed out here.
            const CSS_PX_PER_CM = 96 / 2.54;
            const bodyTableWidthPx = () => ((pageSize == 'a4' ? 21 : 14.8) - 0.53 * 2) * CSS_PX_PER_CM;
            const getColumnWidth = (name) =>
                (columnBaseWidth(name) / totalBaseWidth * bodyTableWidthPx()) + 'px';

            function setupBodySection() {
                if (currentPageCount != 1) {
                    const pageContentHeight = getPageContentHeightPx();
                    const headerAddSection = currentPage.querySelector('.maintable');
                    const footerReserve = getFooterReserveHeightPx();
                    const headerAddHeight = headerAddSection ? getElHeight(headerAddSection) : 0;
                    const usedHeight = headerAddHeight + footerReserve;
                    maxHeight = pageContentHeight - usedHeight - middleGap;
                }

                bodySection = document.createElement('div');
                bodySection.className = 'body';

                let bodyTable = document.createElement('table');
                bodyTable.className = 'body-table';
                // table-layout:auto (the default) recalculates column widths from ALL rows
                // collectively as they're added, so per-row height measurements taken during
                // incremental construction (below) go stale the moment a later row's content
                // forces a retroactive width change in an earlier row's column. Fixed layout
                // locks widths to this header row's percentages instead.
                bodyTable.style.tableLayout = 'fixed';

                let thead = document.createElement('thead');
                let headerRow = document.createElement('tr');

                if (!isHSNSection && !isTermandConditionSection) {
                    product_columns.forEach((column) => {
                        let th = document.createElement('th');
                        if (column.name == "sl_no") {
                            column.display_name = "SL";
                        }
                        th.style.width = getColumnWidth(column.name);
                        if (column.name == "marks_nos_container" || column.name == "no_pkgs") {
                            th.style.maxWidth = '1.85cm';
                        }
                        th.innerHTML = column.display_name;
                        headerRow.appendChild(th);
                    });
                }
                thead.appendChild(headerRow);
                bodyTable.appendChild(thead);

                tbody = document.createElement('tbody');
                bodyTable.appendChild(tbody);
                bodySection.appendChild(bodyTable);
                currentPage.appendChild(bodySection);

                headerHeight = getElHeight(thead);
                let safetyBuffer = 0;
                adjustedMaxHeight = maxHeight - headerHeight - middleGap - safetyBuffer;

                return { bodySection, bodyTable };
            }

            function createNewPageWithHeaderFooter() {
                currentPage = createNewPage();
                currentPageCount++;

                addSectionToPage(currentPage, generateHeaderSection, jsonData, false);

                return setupBodySection();
            }

            function renderItems(tbody, items) {
                items.forEach((item) => {
                    let tr = document.createElement('tr');

                    product_columns.forEach((column) => {
                        let td = document.createElement('td');
                        td.style.borderTop = 'none';
                        td.style.borderBottom = 'none';
                        td.style.borderLeft = '1px solid black';
                        td.style.borderRight = '1px solid black';
                        if (item.pro_image == "") {
                            td.style.verticalAlign = 'top';
                        }
                        if (pageSize == 'a5') {
                            td.style.fontSize = '10.5px';
                        }
                        const styles = columnStyles[column.name] || {};
                        td.style.width = getColumnWidth(column.name);
                        td.style.textAlign = styles.textAlign;
                        td.style.paddingRight = styles.paddingRight;
                        td.style.whiteSpace = styles.whiteSpace;
                        td.style.wordBreak = styles.wordBreak;

                        if (column.name == 'pro_name') {
                            if (item.pro_image) {
                                td.style.display = "flex";
                                td.style.alignItems = "center";
                                td.style.gap = "5px";
                                td.style.border = 'none';

                                let img = document.createElement("img");
                                img.src = item.pro_image;
                                if (pageSize == 'a5') {
                                    img.style.width = "1.59cm";
                                    img.style.height = "1.59cm";
                                } else {
                                    img.style.width = "2.12cm";
                                    img.style.height = "2.12cm";
                                }
                                img.style.objectFit = "contain";
                                td.appendChild(img);
                            }

                            let textContainer = document.createElement("div");
                            textContainer.style.display = "flex";
                            textContainer.style.flexDirection = "column";
                            textContainer.style.gap = "2px";

                            if (item.desc && jsonData.config.display_desc) {
                                let description = document.createElement("span");
                                if (jsonData.config.display_desc == 1) {
                                    description.innerHTML = `${item[column.name]}<span style="font-size: 10px;">&ensp;${formatText(item?.desc)}</span>`;
                                } else if (jsonData.config.display_desc == 2) {
                                    const lines = formatText(item?.desc).split('<br />');
                                    const indented = lines.map(line => `<span class="tab">${line}</span>`).join('');
                                    description.innerHTML = `${item[column.name]}<br>` + indented;
                                }
                                textContainer.appendChild(description);
                            }
                            if (item.serial_no) {
                                let serialSpan = document.createElement("span");
                                const lines = formatText(item?.serial_no).split('<br />');
                                const indented = lines.map(line => `<span class="tab-serial">${line}</span>`).join('');
                                if (!item.desc) {
                                    serialSpan.innerHTML = `${item[column.name]}<span style="font-size: 10px;">&ensp;${indented}</span>`;
                                } else {
                                    serialSpan.innerHTML = indented;
                                }
                                textContainer.appendChild(serialSpan);
                            }

                            if (!item.desc && !item.serial_no) {
                                textContainer.innerHTML = item[column.name] || '';
                            }

                            td.appendChild(textContainer);
                        } else {
                            td.innerHTML = (item[column.name] == 0 || item[column.name] == null) ? '' : item[column.name];
                        }

                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);

                    const rowHeight = getElHeight(tr);
                    currentHeight += rowHeight;

                    if (currentHeight > adjustedMaxHeight) {
                        tbody.removeChild(tr);

                        const lastRow = tbody.lastElementChild;
                        if (lastRow) {
                            lastRow.querySelectorAll('td').forEach((td) => {
                                td.style.borderBottom = '1px solid black';
                            });
                        }

                        ({ bodySection, bodyTable } = createNewPageWithHeaderFooter());
                        tbody = bodyTable.querySelector('tbody');
                        tbody.appendChild(tr);
                        currentHeight = getElHeight(tr);
                    }
                });
            }

            function renderSubTotal(tbody) {

            // Shrink-to-fit: scale down only pages that overflow

            // Main Steps
            function calculateHeightAndRender() {
                // Record the starting page index for this copy
                let copyStartIndex = document.querySelectorAll('.page').length - 1;

                let { bodySection, bodyTable } = setupBodySection();
                renderItems(tbody, items);
                renderSubTotal(tbody);
                renderTaxSplitUp(tbody);
                renderTotal(tbody);
                renderArrearsSection();
                renderHSNTaxSummarySection();
                renderTermsAndConditions();

                const remainingSpaceHeight = adjustedMaxHeight - currentHeight - middleGap;
                if (!hsn) {
                    appendEmptyRowsToTaxSplitUp(remainingSpaceHeight);
                }

                // Add footer only to THIS copy's pages
                let allPages = document.querySelectorAll('.page');
                for (let i = copyStartIndex; i < allPages.length; i++) {
                    let pg = allPages[i];
                    if (!pg.querySelector('.footer-wrapper')) {
                        let pageNum = i - copyStartIndex + 1;
                        addSectionToPage(pg, generateFooterSection, jsonData, jsonData.others, pageNum);
                    }
                    pinFooterToPageBottom(pg);
                }

                // The page the total was carried onto is padded out so it reads like any other:
                // the table running the height of the sheet with the blank in the middle, and the
                // total sitting on the footer at the bottom (Priyanka, 2026-09-03). Done after the
                // footers exist, because the space to fill is the space above one.
                if (totalCarriedToNewPage) {
                    fillCarriedTotalPage(allPages[allPages.length - 1]);
                }

                // Cap body sections so they don't extend behind footer (only this copy's pages)
                allPages = document.querySelectorAll('.page');
                for (let i = copyStartIndex; i < allPages.length; i++) {
                    let pg = allPages[i];
                    let body = pg.querySelector('.body');
                    if (body) {
                        let footerWrapper = pg.querySelector('.footer-wrapper');
                        if (footerWrapper) {
                            let footerTop = footerWrapper.getBoundingClientRect().top;
                            let bodyBottom = body.getBoundingClientRect().bottom;
                            if (bodyBottom > footerTop) {
                                let bodyTop = body.getBoundingClientRect().top;
                                body.style.maxHeight = (footerTop - bodyTop - 1) + 'px';
                                body.style.overflow = 'hidden';
                            }
                        }
                    }
                }

                // Shrink-to-fit: only for THIS copy's pages that overflow
                allPages = document.querySelectorAll('.page');
                for (let i = copyStartIndex; i < allPages.length; i++) {
                    let pg = allPages[i];
                    let pageHeightPx = pageSize == 'a4' ? cmToPx(29.7) : cmToPx(21);
                    let paddingPx = cmToPx(0.53 + 0.15);
                    let availableHeight = pageHeightPx - paddingPx;

                    let contentHeight = 0;
                    Array.from(pg.children).forEach(child => {
                        if (child.classList.contains('imgwatermark') || child.classList.contains('watermark')) return;
                        contentHeight += getElHeight(child);
                    });

                    // Only shrink if overflow is more than 5px (avoid micro-adjustments)
                    if (contentHeight > availableHeight + 5) {
                        let scale = availableHeight / contentHeight;
                        scale = Math.max(scale, 0.75);

                        let wrapper = document.createElement('div');
                        wrapper.style.transformOrigin = 'top left';
                        wrapper.style.transform = 'scale(' + scale + ')';
                        wrapper.style.width = (100 / scale) + '%';
                        // Set wrapper height to scaled content height so no blank space remains
                        wrapper.style.height = availableHeight + 'px';

                        let children = Array.from(pg.children);
                        children.forEach(child => {
                            if (child.classList.contains('imgwatermark') || child.classList.contains('watermark')) return;
                            wrapper.appendChild(child);
                        });
                        pg.appendChild(wrapper);
                    }
                }
            }


            // Pushes the footer to the foot of the sheet.
            //
            // generateFooterSection already asks for this with margin-top:auto, but it sets it on
            // .footer-wrapper, and addSectionToPage drops every section inside an anonymous div -
            // so the auto margin sat on a child of the flex item rather than on the flex item
            // itself and did nothing. On a full page that went unnoticed, the body reaching far
            // enough down that the footer landed near the bottom anyway. On a short last page it
            // left the footer stranded a third of the way down the sheet with the rest blank.
            function pinFooterToPageBottom(pg) {
                let wrapper = pg.querySelector('.footer-wrapper');
                if (!wrapper) return;
                let flexItem = wrapper.parentElement;
                if (flexItem && flexItem.parentElement === pg) {
                    flexItem.style.marginTop = 'auto';
                }
            }

            // Fills the gap above the total on a page the total was carried onto, with a single
            // bordered row, so the table's rules run down the sheet the way they do when a short
            // invoice leaves blank space between its items and its total.
            //
            // Measured against the footer rather than computed from the running height: by this
            // point the page is finished and the footer is where it will print, so the gap is
            // simply what is left between the two.
            function fillCarriedTotalPage(pg) {
                if (!pg) return;
                let table = pg.querySelector('.body-table');
                let tbody = table ? table.querySelector('tbody') : null;
                let footer = pg.querySelector('.footer-wrapper');
                if (!table || !tbody || !footer || !tbody.firstElementChild) return;

                // Sized from the page's own budget rather than the footer's rendered top. The
                // footer is pinned with an auto margin, so the space between it and the table is
                // free space the footer does not occupy - filling all of it pushes the total
                // height past the sheet and trips the shrink-to-fit pass, which then scales the
                // whole page down. What is actually free is the sheet less its padding and less
                // what the sections already take, measured the same way that pass measures it.
                let pageHeightPx = pageSize == 'a4' ? cmToPx(29.7) : cmToPx(21);
                let availableHeight = pageHeightPx - cmToPx(0.53 + 0.15);
                let usedHeight = 0;
                Array.from(pg.children).forEach(function (child) {
                    if (child.classList.contains('imgwatermark') || child.classList.contains('watermark')) return;
                    usedHeight += getElHeight(child);
                });

                let gap = availableHeight - usedHeight - middleGap;
                if (gap <= 2) return;

                // One cell per column, bordered left and right exactly as the empty rows in
                // renderTaxSplitUp are - a single colspan cell would leave the blank area with an
                // outer box and no column rules running through it, which is not what the blank
                // between items and total looks like on a page that fits.
                let spacerRow = document.createElement('tr');
                spacerRow.className = 'empty-row';
                product_columns.forEach(function () {
                    let td = document.createElement('td');
                    td.style.borderTop = 'none';
                    td.style.borderBottom = 'none';
                    td.style.borderLeft = '1px solid black';
                    td.style.borderRight = '1px solid black';
                    td.style.height = gap + 'px';
                    td.innerHTML = '';
                    spacerRow.appendChild(td);
                });
                tbody.insertBefore(spacerRow, tbody.firstElementChild);
            }

            function appendEmptyRowsToTaxSplitUp(remainingHeight) {
                if (remainingHeight <= 2) return;
                const pages = document.querySelectorAll('.page');
                const lastPage = pages[pages.length - 1];
                const taxSplitSection = lastPage.querySelector('.tax-split-section');
                if (taxSplitSection) {
                    let spacer = document.createElement('div');
                    spacer.style.height = Math.max(0, remainingHeight) + 'px';
                    taxSplitSection.appendChild(spacer);
                }
            }
            const remainingHeight = calculateHeightAndRender();
        }

                table_data_mode.innerHTML = '';
                table_row_main1.appendChild(table_data_mode);

                maintable.appendChild(table_row_main1);
            }

            var table_row_main3 = document.createElement('tr');
            var table_data_addbuyer = document.createElement('td');
            table_data_addbuyer.style.width = '50%';
            table_data_addbuyer.rowSpan = '3';
            table_data_addbuyer.style.padding = '3px';
            table_data_addbuyer.style.verticalAlign = 'top';

            const isPurchase = masterDetails?.master_transaction == 1;
            const partyLabel = isPurchase ? "Supplier" : "Buyer (Bill to)";

            var billToDetailsString = `${partyLabel}<br><b>${billToDetails?.party_name?.toUpperCase() || ''}</b>`;
            billToDetailsString += billToDetails.party_add1 ? '<br>' + formatText(billToDetails?.party_add1) + '' : '';
            billToDetailsString += billToDetails.party_add2 ? `${billToDetails.party_add2}` : '';
            billToDetailsString += billToDetails.party_add3 ? `${billToDetails.party_add3}` : '';
            if (billToDetails.party_pin) billToDetailsString += `<br>PIN: ${billToDetails.party_pin}`;
            billToDetailsString += billToDetails.party_phone ? `<br>Phone: ${billToDetails.party_phone}` : '';
            billToDetailsString += billToDetails.party_gstin ? `<br><b>GSTIN/UIN: ${billToDetails.party_gstin}</b>` : '';
            if (data.config.bill_to == true) table_data_addbuyer.innerHTML = billToDetailsString;
            table_row_main3.appendChild(table_data_addbuyer);

            var table_data_addship = document.createElement('td');
            table_data_addship.style.width = '50%';
            table_data_addship.rowSpan = '3';
            table_data_addship.colSpan = '2';
            table_data_addship.style.padding = '3px';
            table_data_addship.style.verticalAlign = 'top';

            if (shipToDetails.name || shipToDetails.add1 || shipToDetails.add2 ||
                shipToDetails.add3 || shipToDetails.pin || shipToDetails.phone || shipToDetails.gstin) {
                var shipToDetailsString = `Consignee (Ship to)<br><b>${shipToDetails.name?.toUpperCase() || ''}</b>`;
                shipToDetailsString += shipToDetails.add1 ? '<br>' + formatText(shipToDetails?.add1) : '';
                shipToDetailsString += shipToDetails.add2 ? shipToDetails.add2 : '';
                shipToDetailsString += shipToDetails.add3 ? shipToDetails.add3 : '';
                if (shipToDetails.pin) shipToDetailsString += `<br>PIN: ${shipToDetails.pin}`;
                shipToDetailsString += shipToDetails.phone ? `<br>Phone: ${shipToDetails.phone}` : '';
                shipToDetailsString += shipToDetails.gstin ? `<br><b>GSTIN/UIN: ${shipToDetails.gstin}</b>` : '';
                if (data.config.ship_to === true) table_data_addship.innerHTML = shipToDetailsString;
            }
            table_row_main3.appendChild(table_data_addship);

            maintable.appendChild(table_row_main3);

            page.appendChild(mainEinvoicetable);
            page.appendChild(maintable);
        }

        // SECTION 3: Invoice Attribute Section
        function generateInvoiceAttributeSection(page, data) {
            if (data.config?.is_packing_slip) return;

            var invAttributes = data.inv_att || [];
            if (invAttributes.length === 0) return;

            var invoiceAttributeSection = document.createElement('div');
            invoiceAttributeSection.className = 'invoice-attribute-section';
            if (pageSize == "a4") invoiceAttributeSection.style.fontSize = '12px';
            else if (pageSize == "a5") invoiceAttributeSection.style.fontSize = '11px';

            var leftPart = document.createElement('div');
            leftPart.className = 'invoice-attribute-half';

            var rightPart = document.createElement('div');
            rightPart.className = 'invoice-attribute-half';

            var leftLines = 0;
            var rightLines = 0;

            invAttributes.forEach(function (attr) {
                var valueLength = attr.value.length;
                var newLineCount = valueLength > 25 ? 2 : 1;

                if (leftLines + newLineCount <= 7) {
                    leftPart.innerHTML += `<b>${attr.key}:</b> ${attr.value}<br>`;
                    leftLines += newLineCount;
                } else if (rightLines + newLineCount <= 7) {
                    rightPart.innerHTML += `<b>${attr.key}:</b> ${attr.value}<br>`;
                    rightLines += newLineCount;
                }
            });

            invoiceAttributeSection.appendChild(leftPart);
            invoiceAttributeSection.appendChild(rightPart);
            page.appendChild(invoiceAttributeSection);
        }

        function getFormattedDateTime() {
            var today = new Date();
            var date = today.getDate() + '-' + (today.getMonth() + 1) + '-' + today.getFullYear();
            var hours = today.getHours();
            var minutes = today.getMinutes();
            var seconds = today.getSeconds();
            var amOrPm = 'AM';
            if (hours >= 12) { amOrPm = 'PM'; if (hours > 12) hours -= 12; }
            if (hours === 0) hours = 12;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;
            return date + ' ' + hours + ':' + minutes + ':' + seconds + ' ' + amOrPm;
        }

        // SECTION 4: Footer Section
        function generateFooterSection(page, footerData, others, pageNumber) {
            let footerWrapper = document.createElement('div');
            footerWrapper.className = 'footer-wrapper';
            footerWrapper.style.marginTop = 'auto';
            // Breathing room above the footer, so the block that ends the body (usually the
            // HSN summary) can't finish flush against the footer's top border - the two
            // hairlines merge into one and it reads as an overlap. Deliberately padding on
            // the footer rather than a margin below .body: everything that measures this
            // layout measures element HEIGHTS (the reserve probe in getFooterReserveHeightPx,
            // and the shrink-to-fit pass that sums the page's children), and heights exclude
            // margins - a margin here is invisible to both, which put the footer 6-9px past
            // the bottom of the sheet where overflow:hidden clipped it.
            footerWrapper.style.paddingTop = '0.15cm';

            let footerSection = document.createElement('div');
            footerSection.className = 'footer-section';
            footerSection.style.display = 'flex';
            footerSection.style.justifyContent = 'space-between';
            footerSection.style.alignItems = 'flex-start';
            footerSection.style.border = '1px solid black';
            footerSection.style.backgroundColor = '#fff';

            if (pageSize == "a4") {
                footerSection.style.height = '2.9cm';
            } else if (pageSize == "a5") {
                footerSection.style.height = '2.1cm';
            }

            var leftDiv = document.createElement('div');
            leftDiv.style.width = '60%';
            leftDiv.style.display = 'flex';
            leftDiv.style.alignItems = 'center';
            leftDiv.style.padding = '3px';

            var qrc = document.createElement('div');
            qrc.id = "qrcode-" + Date.now();
            qrc.style.marginRight = '0.53cm';

            if (footerData.others.upi_id != "" && footerData.config.include_payment_qrcode == true && footerData.config?.is_packing_slip != true) {
                var qrSizePx = pageSize == "a4" ? 90 : 70;

                // The square is reserved here rather than left to the QR library to establish.
                //
                // This box is measured, not just drawn: getFooterReserveHeightPx() renders the
                // footer into a hidden probe and measures it, and everything the body is allowed
                // to occupy is the page minus that number. Left to size itself, this div is only
                // as tall as whatever the library has put inside it AT THAT MOMENT - and the real
                // qrcodejs build finishes asynchronously, drawing to a canvas and then setting an
                // <img> from canvas.toDataURL(), which carries no height until the data URL
                // loads. The probe then measures a footer 90px shorter than the one that
                // eventually prints, the body is handed 90px it does not have, and the block that
                // ends the body - the HSN tax summary - is laid out underneath the footer, where
                // the overflow cap silently clips it away. That is the "HSN summary hidden under
                // footer" report.
                //
                // Reserving the square up front makes the measurement right whether the library
                // has finished or not. min-height rather than height because "Scan to Pay" is
                // appended inside this same div and has to add its line below the code.
                qrc.style.width = qrSizePx + 'px';
                qrc.style.minHeight = qrSizePx + 'px';

                new QRCode(qrc, { text: footerData.others.upi_id, height: qrSizePx, width: qrSizePx });

                var scanToPayText = document.createElement('div');
                scanToPayText.style.fontSize = pageSize == "a4" ? '12px' : '10px';
                scanToPayText.innerHTML = 'Scan to Pay';
                scanToPayText.style.textAlign = 'center';
                qrc.appendChild(scanToPayText);
            }

            var footerDetailsHTML = '';
            if (footerData.footer && footerData.footer.length > 0 && footerData.config?.is_packing_slip != true) {
                footerData.footer.forEach(item => {
                    footerDetailsHTML += `${item.value}<br>`;
                });
            }

            var bankDetailsDiv = document.createElement('div');
            bankDetailsDiv.innerHTML = `${footerDetailsHTML}`;
            leftDiv.appendChild(qrc);
            leftDiv.appendChild(bankDetailsDiv);

            var rightDiv = document.createElement('div');
            rightDiv.style.width = '40%';
            rightDiv.style.textAlign = 'center';
            rightDiv.style.height = '100%';
            rightDiv.style.display = 'flex';
            rightDiv.style.flexDirection = 'column';
            rightDiv.style.justifyContent = 'space-between';
            rightDiv.style.padding = '3px';

            var rcm_detail = document.createElement('p');
            rcm_detail.style.textAlign = 'center';
            rcm_detail.style.fontWeight = '700';
            rcm_detail.style.fontSize = pageSize == "a4" ? '12px' : '10px';
            rcm_detail.style.border = 'none';
            if (footerData.config.is_rcm === true && footerData.config?.is_packing_slip != true) {
                rcm_detail.innerHTML = "Amount of tax subject to Reverse Charge";
            }
            rightDiv.appendChild(rcm_detail);

            if (footerData.config.authorised_signatory == true) {
                var signatureDiv = document.createElement('div');
                if (footerData.design?.signature && footerData.design.signature.trim() !== "" && footerData.config.include_signature == true) {
                    signatureDiv.style.display = 'flex';
                    signatureDiv.style.flexDirection = 'column';
                    signatureDiv.style.alignItems = 'flex-end';
                }
                signatureDiv.style.textAlign = 'right';
                var hasAuthorisedBorder = footerData.config.authorised_border != undefined ? footerData.config.authorised_border : true;
                signatureDiv.style.borderLeft = hasAuthorisedBorder ? '1px solid black' : 'none';
                signatureDiv.style.borderTop = hasAuthorisedBorder ? '1px solid black' : 'none';

                if (pageSize == "a4") {
                    signatureDiv.style.paddingTop = '0.26cm';
                    signatureDiv.style.fontSize = '12px';
                } else if (pageSize == "a5") {
                    signatureDiv.style.fontSize = '10px';
                }

                if (footerData.design?.signature && footerData.design.signature !== "" && footerData.config.include_signature == true) {
                    var companyNameDiv = document.createElement('div');
                    companyNameDiv.innerHTML = `<b>for ${footerData.be_details.beb_name.toUpperCase()}</b>`;
                    signatureDiv.appendChild(companyNameDiv);

                    var figure = document.createElement("figure");
                    figure.style.margin = '0';
                    figure.style.width = '2.65cm';
                    figure.style.height = '1.32cm';

                    var logoImage = document.createElement("img");
                    logoImage.src = footerData.design?.signature;
                    logoImage.style.width = '100%';
                    logoImage.style.height = '100%';
                    logoImage.style.objectFit = 'contain';
                    figure.appendChild(logoImage);

                    signatureDiv.appendChild(figure);

                    var signatoryText = document.createElement('div');
                    signatoryText.innerHTML = `Authorised Signatory`;
                    signatureDiv.appendChild(signatoryText);
                } else {
                    signatureDiv.innerHTML = `<b>for ${footerData.be_details.beb_name.toUpperCase()}</b><br><br><br>Authorised Signatory`;
                }
                rightDiv.appendChild(signatureDiv);
            }

            footerSection.appendChild(leftDiv);
            footerSection.appendChild(rightDiv);
            footerWrapper.appendChild(footerSection);

            var additionalFooterRow = document.createElement('div');
            additionalFooterRow.className = 'additionalFooterRow';
            additionalFooterRow.style.display = 'flex';
            additionalFooterRow.style.justifyContent = 'space-between';
            additionalFooterRow.style.fontSize = pageSize == "a4" ? '12px' : '10px';

            additionalFooterRow.id = `footer-row-${pageNumber}-${typeOfCopy}`;

            additionalFooterRow.innerHTML = `
                <div>${footerData.config?.footer_date ? getFormattedDateTime() : ''}</div>
                <div style="text-align: center; flex-grow: 1;">
                    ${footerData.config?.is_packing_slip !== true ? 'This is a Computer Generated Document' : ''}
                </div>
                <div style="text-align: right;">Page No. ${pageNumber}</div>
            `;

            footerWrapper.appendChild(additionalFooterRow);
            page.appendChild(footerWrapper);

            let bodyEl = page.querySelector('.body');
            if (bodyEl) {
                let footerTop = getElHeight(footerSection) + getElHeight(additionalFooterRow) + cmToPx(0.3);
                let pageContentH = getPageContentHeightPx();
                let headerEls = page.querySelectorAll('.maintable, .mainEinvoicetable, .invoice-attribute-section');
                let headerH = 0;
                headerEls.forEach(el => { headerH += getElHeight(el); });
                let availableForBody = pageContentH - headerH - footerTop;
                bodyEl.style.maxHeight = availableForBody + 'px';
                bodyEl.style.overflow = 'hidden';
            }
        }

        function addLogoWatermark(page) {
            if (jsonData.design && jsonData.design.logo && jsonData.design.logo !== "" &&
                jsonData.config && jsonData.config?.logo_watermark === true) {
                var watermarkDiv = document.createElement('div');
                watermarkDiv.className = 'imgwatermark';

                var watermarkImg = document.createElement('img');
                watermarkImg.src = jsonData.design.logo;
                watermarkImg.alt = 'Watermark';
                watermarkImg.style.width = '7.94cm';
                watermarkImg.style.height = '7.94cm';
                watermarkImg.style.objectFit = 'contain';

                watermarkDiv.appendChild(watermarkImg);
                page.appendChild(watermarkDiv);
            }
        }

        //function formatText(text) {
         //   return text
         //       .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
         //       .replace(/_(.*?)_/g, '<i>$1</i>')
         //       .replace(/~(.*?)~/g, '<u>$1</u>')
         //       .replace(/\r?\n/g, '<br />');
       // }

        function formatText(text) {
            if (!text) return '';
            return text.replace(/\r?\n/g, '<br />'); // only normalize stray newlines
        }

        // Injects (or updates) an @page rule sized to the true physical paper (A4/A5) with
        // zero margin. Without this, printing falls back to whatever default page size the
        // browser/printer assumes (e.g. Letter), which is shorter than a 29.7cm A4 .page div -
        // so the browser's own print pagination sliced a single .page in two, producing extra
        // printed pages the on-screen preview never showed.
        function ensurePageSizeStyle(size) {
            let styleEl = document.getElementById('dynamic-page-size-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'dynamic-page-size-style';
                document.head.appendChild(styleEl);
            }
            let dimensions = size == 'a4' ? '21cm 29.7cm' : '14.8cm 21cm';
            styleEl.textContent = '@page { size: ' + dimensions + '; margin: 0; }';
        }

        // Defensive reset: generateReport() re-runs whole on every resize/beforeprint (see
        // listeners below), reusing the same document - without clearing previously generated
        // pages first, old .page elements would stay in the DOM and the new run would just pile
        // up after them.
        function resetGeneratedContent() {
            document.querySelectorAll('.page').forEach((p) => p.remove());
            document.body.classList.remove('page-a4', 'page-other');
        }

        // Renders one or more invoices onto the same document, back-to-back, so that a single
        // window.print() call (fired once by the host page - see invoice-preview.component.ts)
        // produces one continuous print job covering all of them, rather than a separate print
        // dialog per invoice. A bulk print sends { invoices: [ ...one payload per selected
        // invoice... ] }; a single invoice preview sends the invoice payload directly - both
        // are normalized to an array here so the rest of the pipeline doesn't need to care
        // which case it's in.
        function generateReport() {
            // Already resolved and already parsed (see the loadReportPayload call at the bottom
            // of this script), so the repeated rebuilds - resize, zoom, beforeprint - cost
            // nothing. This used to re-read sessionStorage, re-decode base64 and re-parse the
            // whole payload on every one of them, which on a bulk batch is the entire batch.
            const payload = getReportPayload();

            if (payload) {
                try {
                    resetGeneratedContent();

                    const invoiceList = Array.isArray(payload.invoices) ? payload.invoices : [payload];

                    copyPageIndices = [];

                    invoiceList.forEach((invoiceData) => {
                        jsonData = invoiceData;
                        pageSize = (jsonData.others.page_size == "" || jsonData.others.page_size == undefined) ? 'a4' : jsonData.others.page_size;
                        const container = document.querySelector('body');
                        container.classList.add(pageSize == 'a4' ? 'page-a4' : 'page-other');
                        // NOTE: with mixed A4/A5 invoices in one bulk batch, whichever invoice
                        // renders last wins the @page size for the whole print job (same
                        // limitation the on-screen preview already has - see
                        // getPageDimensionsCm in invoice-preview.component.ts, which reads only
                        // the first .page element). Not a concern for same-size batches.
                        ensurePageSizeStyle(pageSize);

                        if (!jsonData.copies || jsonData.copies.length === 0) {
                            jsonData.copies = [{ type: "Original", typeOfCopy: 0 }];
                        }

                        for (let a = 0; a < jsonData.copies.length; a++) {
                            typeOfCopy = jsonData.copies[a].typeOfCopy;
                            currentPageCount = 1;
                            isHSNSection = false;
                            isTermandConditionSection = false;
                            isFirstPage = true;
                            _pxPerCm = null;
                            _footerReserveHeight = null;
                            generateSingleCopy(typeOfCopy);
                        }
                    });

                } catch (error) {
                    console.error('Error rendering the invoice payload:', error);
                }
            } else {
                console.error('No invoice payload found to render.');
            }
        }

        const RESIZE_DEBOUNCE_MS = 200;
        let resizeTimer;
        // The host page (invoice-preview.component.ts) resizes THIS iframe's own width/height
        // to its true full size right before printing, then back to '' right after - and
        // because that's a genuine size change to the iframe's own box, it fires a 'resize'
        // event in here too, indistinguishable from a real user resize/zoom. Without this
        // flag, that self-inflicted resize would schedule a second, redundant
        // resetGeneratedContent()+rebuild ~200ms after beforeprint's own (correct, synchronous)
        // rebuild already ran - racing against onAfterPrint's fitFrame() call on the outside,
        // which measures this document's size *before* that late rebuild fires. Deterministic
        // data makes the rebuild's result identical either way, but the DOM briefly goes
        // through resetGeneratedContent()'s empty state while it reruns - exactly the kind of
        // window a screenshot (or a slower real print dialog) could catch mid-flight.
        let isPrinting = false;
        // Pagination is otherwise a one-time calculation done at load. If the user zooms
        // in/out (or resizes the window) after the report is already rendered, text can
        // reflow slightly differently at the new size, growing a row past what was originally
        // budgeted for - and since later sections/footer sit at positions computed from the
        // old budget, that growth pushes content into/past them. Zoom changes fire a resize
        // event (they change the effective CSS pixel viewport), so re-running generateReport()
        // here re-paginates against the new, live measurements.
        window.addEventListener('resize', () => {
            if (isPrinting) {
                return;
            }
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(generateReport, RESIZE_DEBOUNCE_MS);
        });

        // Printing is a separate rendering pass that can differ from the on-screen zoom, so a
        // page grouping calibrated for the current screen doesn't necessarily match what
        // actually prints. Regenerating here calibrates pagination against print. This is only
        // safe because generateReport()/generateSingleCopy() are fully synchronous now - an
        // async handler here would risk the browser capturing print output mid-rebuild (right
        // after resetGeneratedContent() clears the page but before the new content is added),
        // producing a blank printed page.
        window.addEventListener('beforeprint', () => {
            isPrinting = true;
            generateReport();
        });
        // NOT cleared synchronously on afterprint - onAfterPrint's iframe.style.width/height
        // reset (on the host page) fires its own native 'resize' event on this window, but
        // that event arrives asynchronously (a task or more later), after this handler's own
        // synchronous code already finished. Clearing the flag here immediately would very
        // likely already be false again by the time that trailing resize event shows up,
        // defeating the guard above entirely (confirmed empirically - the naive
        // "clear synchronously on afterprint" version still let the redundant rebuild through
        // every time). Outlasting the resize debounce window comfortably covers it instead.
        window.addEventListener('afterprint', () => {
            setTimeout(() => {
                isPrinting = false;
            }, RESIZE_DEBOUNCE_MS + 100);
        });

        // Resolves the payload once, then renders. Only this step can be async (the IndexedDB
        // fallback is); every rebuild after it reads the cached object synchronously, which is
        // what keeps the beforeprint rebuild above safe.
        loadReportPayload('temp_inv_data', generateReport);

        // Pagination is measured against the zoom level in force when the report was built, so
        // a later zoom change has to rebuild it - see public/assets/js/report-zoom.js for the
        // detail, including why a zoom change is polled for rather than listened for.
        watchZoomAndRepaginate(generateReport);
    </script>
