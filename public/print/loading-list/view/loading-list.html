<html>

<head>
    <meta charset="utf-8">
    <title>Loading List</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #f0f0f0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Sized to the true physical paper with zero margin. Without this, printing falls
           back to whatever default paper size the browser assumes (commonly Letter), which
           is shorter than this report's 29.1cm .page div - the mismatch makes the browser's
           own print pagination slice a single .page in two, producing extra printed pages
           the on-screen preview never showed. */
        @page {
            size: 21cm 29.1cm;
            margin: 0;
        }

        .page-wrapper {
            width: 21cm;
            margin: 0 auto 0.5cm auto;
            transform-origin: top center;
        }

        .page {
            background: white;
            position: relative;
            /* Keeps any padding inside the declared 21cm x 29.1cm rather than adding to it.
               Without it a page renders slightly taller than the size every height
               calculation here assumes, and that error compounds across pages until the
               outer preview iframe (sized from pageCount x 29.1cm) falls short of the real
               content and shows its own scrollbar mid-print. */
            box-sizing: border-box;
            box-shadow: 0 0 0.5cm rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            page-break-after: always;
            overflow: hidden;
            width: 21cm;
            height: 29.1cm;
        }

        @media print {
            html, body { background: white; }
            .page-wrapper { margin: 0; transform: none !important; width: 21cm; }
            .page { height: 29.1cm; margin: 0; box-shadow: none; background: white; page-break-after: always; overflow: hidden; }
            .no-print { display: none; }

            /* Without this, the browser's print engine can slice a row's multi-line cell
               content across a physical page boundary if a page's true printed dimensions
               (after margins/DPI) diverge even slightly from the JS's height budget. */
            tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }

        /* Without this the truly-last page also gets page-break-after: always with nothing
           left to flow onto the next page - Chrome still honors that as a forced break and
           prints a genuine blank trailing sheet. */
        .page:last-child { page-break-after: auto; }
        .page-wrapper:last-child .page { page-break-after: auto; }

        h5 { text-align: left; color: black; font-family: Arial, Helvetica, sans-serif; font-size: 3.4mm; margin: 0; font-weight: normal; }

        .header-section { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 3mm 4mm; box-sizing: border-box; }
        .header-left { flex: 1; }
        .header-right { text-align: right; font-family: Arial, Helvetica, sans-serif; font-size: 3.2mm; }
        .sub-address { font-size: 3.2mm; margin: 0; }

        .body { display: flex; flex-direction: column; padding: 0 10mm 0 4mm; box-sizing: border-box; overflow: hidden; }

        .body-table { width: 100%; border-collapse: collapse; font-family: Arial, Helvetica, sans-serif; }
        .body-table th { font-weight: bold; font-size: 3.7mm; border-top: 0.5mm solid black; border-bottom: 0.5mm solid black; padding: 1mm 0.5mm; }
        .body-table td { font-size: 3.5mm; padding: 0.5mm; vertical-align: top; }

        .footer-section { position: absolute; left: 0; bottom: 2.5mm; width: 100%; box-sizing: border-box; padding: 0 5mm; }
        .footer-section hr { width: 100%; margin: 0 0 1mm 0; }
        .footer-grid { display: flex; justify-content: space-between; font-family: Arial, Helvetica, sans-serif; font-size: 3.4mm; font-weight: bold; }
        .footer-grid p { margin: 0; }
    </style>
</head>

<body>

    <script>
        // Physical page size, declared once and reused everywhere it matters: the @page rule
        // above, the .page CSS, and (read off the rendered element's data attributes) the
        // preview wrapper that embeds this file. Keeping one source of truth is what stops
        // the wrapper's sizing math from drifting out of step with the real rendered page.
        const PAGE_WIDTH_CM = 21;
        const PAGE_HEIGHT_CM = 29.1;

        let other = "";
        let company_details = "";
        let loading_list_details = "";
        let config = "";
        let pageSize = 'a4';
        let currentPageCount = 1;
        let totalPages = 1;

        // ===== ZOOM-INDEPENDENT MEASUREMENT SYSTEM =====
        let _pxPerCm = null;
        function getPxPerCm() {
            if (_pxPerCm === null) {
                let ref = document.createElement('div');
                ref.style.width = '10cm';
                ref.style.height = '10cm';
                ref.style.position = 'absolute';
                ref.style.left = '-9999px';
                ref.style.top = '-9999px';
                ref.style.visibility = 'hidden';
                document.body.appendChild(ref);
                _pxPerCm = ref.getBoundingClientRect().height / 10;
                document.body.removeChild(ref);
            }
            return _pxPerCm;
        }

        function cmToPx(cm) {
            return cm * getPxPerCm();
        }

        function getElHeight(el) {
            if (!el) return 0;
            return el.getBoundingClientRect().height;
        }

        // Measure actual rendered footer height from its children
        // (absolutely positioned elements can return 0 for offsetHeight)
        function measureFooterHeight(page) {
            let footerSection = page.querySelector('.footer-section');
            if (!footerSection) return cmToPx(1.5); // fallback
            let children = footerSection.children;
            let totalH = 0;
            for (let i = 0; i < children.length; i++) {
                totalH += getElHeight(children[i]);
            }
            // Add the bottom offset (2.5mm) + small gap
            totalH += cmToPx(0.35);
            return totalH;
        }

        // Get available body height by measuring actual rendered elements on the page
        function getAvailableBodyHeight(page) {
            // Measure the ACTUAL page element height — not computed from cm
            // This eliminates sub-pixel rounding mismatches at extreme zoom levels
            let pageHeightPx = page.getBoundingClientRect().height;

            // Measure actual header
            let headerSec = page.querySelector('.header-section');
            let headerH = headerSec ? getElHeight(headerSec) : 0;

            // Measure actual footer from children
            let footerH = measureFooterHeight(page);

            // Safety buffer to absorb sub-pixel rounding across zoom levels
            let safetyBuffer = cmToPx(0.3);

            return pageHeightPx - headerH - footerH - safetyBuffer;
        }

        const CM_TO_PX = 37.795;

        function base64ToUtf8(urlSafeBase64) {
            let base64 = urlSafeBase64.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) { base64 += '='; }
            const binaryString = atob(base64);
            const bytes = new Uint8Array([...binaryString].map(char => char.charCodeAt(0)));
            return new TextDecoder().decode(bytes);
        }

        function waitForNonZeroHeights(currentPage) {
            return new Promise((resolve) => {
                function checkHeights() {
                    const headerSection = currentPage.querySelector('.header-section');
                    const footerSection = currentPage.querySelector('.footer-section');
                    const headerHeight = headerSection ? getElHeight(headerSection) : 0;
                    const footerHeight = measureFooterHeight(currentPage);
                    if (headerHeight > 0 && footerHeight > 0) {
                        resolve({ headerHeight, footerHeight });
                    } else {
                        requestAnimationFrame(checkHeights);
                    }
                }
                checkHeights();
            });
        }

        function createNewPage() {
            let wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            let newPage = document.createElement('div');
            newPage.className = 'page';
            newPage.style.position = 'relative';
            newPage.style.pageBreakBefore = 'always';
            // Read by the preview wrapper (report-preview.component.ts) to size the embedding
            // iframe from a plain DOM read rather than a rendered measurement, which would be
            // distorted by whatever on-screen zoom/scale is currently applied.
            newPage.setAttribute('data-page-w-cm', String(PAGE_WIDTH_CM));
            newPage.setAttribute('data-page-h-cm', String(PAGE_HEIGHT_CM));
            wrapper.appendChild(newPage);
            document.body.appendChild(wrapper);
            return newPage;
        }

        function addSectionToPage(currentPage, sectionFunc, ...args) {
            sectionFunc(currentPage, ...args);
        }

        function generateHeaderSection(page) {
            let headerSection = document.createElement('div');
            headerSection.className = 'header-section';

            let headerLeft = document.createElement('div');
            headerLeft.className = 'header-left';
            let leftH5 = document.createElement('h5');
            let addressLine = `${company_details.be_addline1 || ''} ${company_details.be_addline2 || ''} ${company_details.be_addline3 || ''} ${company_details.be_state || ''} ${company_details.be_pin || ''}`;
            let phoneText = company_details.be_phone ? `<br>Phone Number: ${company_details.be_phone}` : '';
            let gstinText = company_details.be_gstin ? `<br><b>GSTIN: ${company_details.be_gstin}</b>` : '';
            leftH5.innerHTML = `<b>${company_details.be_name}</b><br><p class='sub-address'>${addressLine}${phoneText}${gstinText}</p>`;
            headerLeft.appendChild(leftH5);

            let headerRight = document.createElement('div');
            headerRight.className = 'header-right';
            let rightP = document.createElement('p');
            rightP.style.margin = '0';
            if (other.from_ref_no > "0" && other.to_ref_no > "0") {
                rightP.innerHTML = `Brief ${other.transaction_type} Report (in Qty)<br>From Bill / Ref # &nbsp;&nbsp;${other.from_ref_no} to ${other.to_ref_no}`;
            } else {
                rightP.innerHTML = `Brief ${other.transaction_type} Report (in Qty)<br><b>From ${other.from_date} to ${other.to_date}</b>`;
            }
            headerRight.appendChild(rightP);

            headerSection.appendChild(headerLeft);
            headerSection.appendChild(headerRight);
            page.appendChild(headerSection);
        }

        function buildTableHeader() {
            let headerRow = document.createElement('tr');
            const headers = [
                { text: 'Sl', width: '5%', align: 'center' },
                { text: 'Brand', width: '10%', align: 'left' },
                { text: 'Abr', width: '10%', align: 'left' },
                { text: 'Item Description', width: '50%', align: 'left' },
                { text: 'MRP', width: '10%', align: 'center' },
                { text: 'Qty', width: '5%', align: 'center' }
            ];
            headers.forEach(h => {
                let th = document.createElement('th');
                th.innerHTML = h.text;
                th.style.width = h.width;
                th.style.textAlign = h.align;
                headerRow.appendChild(th);
            });
            return headerRow;
        }

        function generateBodySectionWithPagination(currentPage, items) {
            let tbody, bodySection, bodyTable;
            let currentHeight = 0;
            let adjustedMaxHeight = 0;
            let activePage = currentPage;

            function setupBodySection() {
                // Always measure available height from actual rendered elements
                let availableHeight = getAvailableBodyHeight(activePage);

                bodySection = document.createElement('div');
                bodySection.className = 'body';

                bodyTable = document.createElement('table');
                bodyTable.className = 'body-table';
                // table-layout:auto (the default) recalculates column widths from ALL rows
                // collectively as they're added, so the per-row height measurements taken
                // during incremental construction below go stale the moment a later row's
                // content forces a retroactive width change in an earlier row's column.
                bodyTable.style.tableLayout = 'fixed';

                let thead = document.createElement('thead');
                thead.appendChild(buildTableHeader());
                bodyTable.appendChild(thead);

                tbody = document.createElement('tbody');
                bodyTable.appendChild(tbody);
                bodySection.appendChild(bodyTable);
                activePage.appendChild(bodySection);

                let theadHeight = getElHeight(thead);
                adjustedMaxHeight = availableHeight - theadHeight;
                currentHeight = 0;

                return { bodySection, bodyTable };
            }

            function createNewPageWithHeaderFooter() {
                activePage = createNewPage();
                currentPageCount++;
                addSectionToPage(activePage, generateHeaderSection);
                addSectionToPage(activePage, generateFooterSection, currentPageCount);
                return setupBodySection();
            }

            function buildRow(item) {
                let tr = document.createElement('tr');
                const cells = [
                    { value: item.row_sl, align: 'center' },
                    { value: item['Brand Short Name'], align: 'left' },
                    { value: item.pro_code, align: 'left' },
                    { value: item['Product Name'], align: 'left' },
                    { value: item.pro_mrp, align: 'right' },
                    { value: item.qty, align: 'right' }
                ];
                cells.forEach(c => {
                    let td = document.createElement('td');
                    td.innerHTML = (c.value == null || c.value === undefined) ? '' : c.value;
                    td.style.textAlign = c.align;
                    if (config.main_table_border != false) {
                        td.style.border = '1px solid black';
                    } else {
                        td.style.border = 'none';
                    }
                    tr.appendChild(td);
                });
                return tr;
            }

            function renderItems(itemsList) {
                for (let i = 0; i < itemsList.length; i++) {
                    let tr = buildRow(itemsList[i]);
                    tbody.appendChild(tr);
                    const rowHeight = getElHeight(tr);
                    currentHeight += rowHeight;

                    if (currentHeight > adjustedMaxHeight) {
                        tbody.removeChild(tr);
                        currentHeight -= rowHeight;

                        // Cap current body section height before moving on
                        capBodyHeight(activePage);

                        ({ bodySection, bodyTable } = createNewPageWithHeaderFooter());
                        tbody = bodyTable.querySelector('tbody');

                        tbody.appendChild(tr);
                        currentHeight = getElHeight(tr);
                    }
                }
            }

            ({ bodySection, bodyTable } = setupBodySection());
            renderItems(items);

            // Cap body height on all pages
            let allPages = document.querySelectorAll('.page');
            allPages.forEach(pg => capBodyHeight(pg));
        }

        function capBodyHeight(pg) {
            let body = pg.querySelector('.body');
            if (!body) return;
            let footerSec = pg.querySelector('.footer-section');
            if (!footerSec) return;

            // Use the first visible footer child's top as reference
            let footerChildren = footerSec.children;
            let footerTop = Infinity;
            for (let i = 0; i < footerChildren.length; i++) {
                let rect = footerChildren[i].getBoundingClientRect();
                if (rect.height > 0 && rect.top < footerTop) {
                    footerTop = rect.top;
                }
            }
            // Fallback to footer section's own rect
            if (footerTop === Infinity) {
                footerTop = footerSec.getBoundingClientRect().top;
            }

            let bodyTop = body.getBoundingClientRect().top;
            let targetHeight = footerTop - bodyTop - cmToPx(0.1);
            if (targetHeight > 0) {
                body.style.height = targetHeight + 'px';
                body.style.maxHeight = targetHeight + 'px';
                body.style.overflow = 'hidden';
            }
        }

        function generateFooterSection(page, pageNumber) {
            let footerSection = document.createElement('div');
            footerSection.className = 'footer-section';

            let hr = document.createElement('hr');
            footerSection.appendChild(hr);

            let footerGrid = document.createElement('div');
            footerGrid.className = 'footer-grid';

            let fdatetime = document.createElement('p');
            let today = new Date();
            let date = today.getDate() + '-' + (today.getMonth() + 1) + '-' + today.getFullYear();
            let hours = today.getHours();
            let minutes = today.getMinutes();
            let seconds = today.getSeconds();
            let amOrPm = 'AM';
            if (hours >= 12) { amOrPm = 'PM'; if (hours > 12) hours -= 12; }
            if (hours === 0) hours = 12;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;

            fdatetime.innerHTML = `${date} ${hours}:${minutes}:${seconds} ${amOrPm}`;
            footerGrid.appendChild(fdatetime);

            let fpagecount = document.createElement('p');
            fpagecount.innerHTML = `Page : ${pageNumber} of ${totalPages}`;
            footerGrid.appendChild(fpagecount);

            footerSection.appendChild(footerGrid);
            page.appendChild(footerSection);
        }

        function updateAllFooters() {
            const allPages = document.querySelectorAll('.page');
            allPages.forEach((pg, idx) => {
                const footerGrid = pg.querySelector('.footer-grid');
                if (footerGrid) {
                    const pageCountP = footerGrid.querySelectorAll('p')[1];
                    if (pageCountP) {
                        pageCountP.innerHTML = `Page : ${idx + 1} of ${totalPages}`;
                    }
                }
            });
        }

        function applyResponsiveScale() {
            if (window.matchMedia('print').matches) return;

            const wrappers = document.querySelectorAll('.page-wrapper');
            if (!wrappers.length) return;

            const pageWidthPx = PAGE_WIDTH_CM * CM_TO_PX;
            const availableWidth = document.documentElement.clientWidth - 20;

            let scale = 1;
            if (availableWidth < pageWidthPx) {
                scale = availableWidth / pageWidthPx;
            }

            wrappers.forEach(w => {
                w.style.transform = `scale(${scale})`;
                w.style.width = pageWidthPx + 'px';
                const pg = w.querySelector('.page');
                if (pg) {
                    const realH = pg.getBoundingClientRect().height / scale;
                    w.style.height = (realH * scale) + 'px';
                }
            });
        }

        // Defensive reset so a re-run (on resize) rebuilds from scratch instead of piling
        // new pages up after the old ones.
        function resetGeneratedContent() {
            document.querySelectorAll('.page-wrapper').forEach((w) => w.remove());
            currentPageCount = 1;
            totalPages = 1;
        }

        async function generateLoadingList() {
            let searchParams = new URLSearchParams(window.location.search);
            let message = searchParams.get('message');

            try {
                resetGeneratedContent();

                let retrievedValue = localStorage.getItem('loadingData');
                let myArray;

                if (retrievedValue !== null) {
                    let decodedString = base64ToUtf8(retrievedValue);
                    myArray = JSON.parse(decodedString);
                } else if (message) {
                    let decodedString = base64ToUtf8(message);
                    myArray = JSON.parse(decodedString);
                } else {
                    console.error('No data found.');
                    return;
                }

                other = myArray.other;
                company_details = myArray.company_details;
                loading_list_details = myArray.loading_list_details;
                config = myArray.config || {};

                pageSize = (other.page_size == "" || other.page_size == undefined) ? 'a4' : other.page_size;
                totalPages = 1;

                // Reset px-per-cm cache each render
                _pxPerCm = null;

                let currentPage = createNewPage();
                addSectionToPage(currentPage, generateHeaderSection);
                addSectionToPage(currentPage, generateFooterSection, 1);

                await waitForNonZeroHeights(currentPage);

                generateBodySectionWithPagination(currentPage, loading_list_details);

                totalPages = currentPageCount;
                updateAllFooters();

                applyResponsiveScale();

            } catch (error) {
                console.error('Error decoding or parsing JSON:', error);
            }
        }

        // The host preview page resizes THIS iframe's own width/height to its true full size
        // right before printing, then back again right after - a genuine size change to the
        // iframe's box, so it fires a 'resize' event in here too, indistinguishable from a
        // real user resize. Without this flag that self-inflicted resize re-runs the scaling
        // while the host is mid-print, racing the host's own measurement of this document.
        let isPrinting = false;
        window.addEventListener('resize', () => {
            if (isPrinting) return;
            applyResponsiveScale();
        });

        window.addEventListener('beforeprint', () => {
            isPrinting = true;
            document.querySelectorAll('.page-wrapper').forEach(w => {
                w.style.transform = 'none';
                w.style.width = 'auto';
                w.style.height = 'auto';
            });
        });
        // Cleared on a delay rather than synchronously - the resize this print cycle triggers
        // arrives asynchronously, after a synchronous handler would already have cleared the
        // flag again, which would defeat the guard entirely.
        window.addEventListener('afterprint', () => {
            setTimeout(() => {
                isPrinting = false;
                applyResponsiveScale();
            }, 300);
        });

        generateLoadingList();
    </script>

</body>

</html>
