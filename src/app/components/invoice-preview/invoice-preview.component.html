<div class="preview-toolbar">
  <!-- Design and paper size are both properties of how this invoice is rendered, not of the
       invoice itself, so they live here rather than on the screen that opened the preview. -->
  <!-- A dropdown rather than a button per design: there are ten of them, which no toolbar
       row fits, and the list is expected to keep growing. -->
  <label class="design-picker">
    <span class="design-label">Design</span>
    <select [value]="activeLayoutId" (change)="setLayout($any($event.target).value)">
      @for (layout of layouts; track layout.id) {
        <option [value]="layout.id">{{ layout.label }}</option>
      }
    </select>
  </label>
  <span class="switch" role="group" aria-label="Paper size">
    @for (size of paperSizes; track size) {
      <button
        type="button"
        class="switch-button"
        [class.active]="size === activeSize"
        [attr.aria-pressed]="size === activeSize"
        (click)="setPaperSize(size)">
        {{ size | uppercase }}
      </button>
    }
  </span>
  <!-- Sits beside Print because all three are ways of taking the invoice out of the app: to
       paper, to a PDF file, or to a spreadsheet. -->
  <button id="excelButton" type="button" (click)="exportExcel()">Export to Excel</button>
  <!-- Saves the file directly, with no print dialog to drive - and always exports the design and
       paper size currently on screen. -->
  <button id="pdfButton" type="button" [disabled]="isBuildingPdf" (click)="downloadPdf()">
    {{ isBuildingPdf ? 'Preparing PDF...' : 'Download PDF' }}
  </button>
  <button id="printButton" type="button" (click)="print()">Print</button>
</div>
<div class="preview-viewport">
  <div #frameWrapper class="frame-wrapper">
    <iframe #invoiceFrame class="invoice-frame" title="Invoice preview"></iframe>
  </div>
</div>
