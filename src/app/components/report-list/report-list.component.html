<div class="reports-wrapper">
  <div class="reports-header">
    <span class="header-title">Report Layouts</span>
    <span class="header-sub">Open any layout to preview it on screen and print it.</span>
  </div>

  <div class="reports-grid">
    @for (layout of layouts; track layout.id) {
      <button class="report-card" type="button" (click)="openPreview(layout.id)">
        <span class="report-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </span>
        <span class="report-name">{{ layout.label }}</span>
        <span class="report-action">Preview &amp; Print</span>
      </button>
    }
  </div>
</div>
