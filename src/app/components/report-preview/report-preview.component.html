<div class="preview-toolbar">
  <!-- Only the layouts that render more than one paper size get this; the size is a field in
       the payload, not a different file, so switching re-renders the same layout. -->
  @if (paperSizes.length) {
    <span class="size-switch" role="group" aria-label="Paper size">
      @for (size of paperSizes; track size) {
        <button
          type="button"
          class="size-button"
          [class.active]="size === activeSize"
          [attr.aria-pressed]="size === activeSize"
          (click)="setPaperSize(size)">
          {{ size | uppercase }}
        </button>
      }
    </span>
  }
  <!-- Saves the file directly, with no print dialog to drive - and always exports the paper size
       currently on screen. -->
  <button id="pdfButton" type="button" [disabled]="isBuildingPdf" (click)="downloadPdf()">
    {{ isBuildingPdf ? 'Preparing PDF...' : 'Download PDF' }}
  </button>
  <button id="printButton" type="button" (click)="print()">Print</button>
</div>
<div class="preview-viewport">
  <div #frameWrapper class="frame-wrapper">
    <iframe #reportFrame class="report-frame" [title]="reportTitle"></iframe>
  </div>
</div>
