@if (isStandalonePage) {
  <!-- Customer-facing weblink pages render full-page, without the ERP sidebar/header shell -->
  <router-outlet></router-outlet>
} @else {
  <div class="app-layout-grid" [class.collapsed]="isSidebarCollapsed">
    <!-- Left Sidebar Navigation -->
    <app-sidebar
      [class.open]="isSidebarOpen"
      [class.collapsed]="isSidebarCollapsed"
      [isCollapsed]="isSidebarCollapsed"
      (toggleCollapse)="toggleSidebarCollapse()">
    </app-sidebar>

    <!-- Mobile Sidebar Backdrop Overlay -->
    @if (isSidebarOpen) {
      <div
        class="mobile-sidebar-backdrop"
        (click)="closeSidebar()">
      </div>
    }

    <!-- Right Side Main Content Panel -->
    <div class="main-body-container">
      <!-- Top Header -->
      <app-header (toggleSidebar)="toggleSidebar()"></app-header>

      <!-- Active Page Content -->
      <main class="page-content-outlet">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}

<!-- Report previews (invoice, bulk print, ledger, the report layouts) open here as a dialog
     over whatever screen asked for them, rather than in a new browser tab. Rendered once at the
     app's root, so the screens that open a preview only set the request (see
     PreviewDialogService) and never carry any dialog markup of their own. -->
@if (previewDialog.request(); as previewRequest) {
  <app-preview-dialog [request]="previewRequest"></app-preview-dialog>
}
