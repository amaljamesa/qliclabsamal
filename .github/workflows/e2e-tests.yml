name: QA automation test - 1
run-name: QA automation test - 1

on:
  push:

jobs:
  e2e:
    name: Party form save -> Django API -> DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        # npm ci fails here: package-lock.json was generated on Windows, and its
        # strict validation rejects the peer deps of an optional wasm32-only
        # package (@napi-rs/wasm-runtime) that Windows never needed to resolve.
        # npm install resolves per-platform correctly instead.
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Start Django backend
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8000/api/parties/ > /dev/null && break
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e test
        id: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Result
        if: always()
        run: |
          if [ "${{ steps.e2e.outcome }}" = "success" ]; then
            echo "## Result: YES - party form save verified (UI -> Django API -> DB)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Result: NO - party form save test failed (see playwright-report artifact)" >> "$GITHUB_STEP_SUMMARY"
          fi
